<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Resinaprint Tycoon</title>
<meta name="theme-color" content="#1a1612">
<meta name="description" content="Build a resin figure printing empire.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Resinaprint">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="meta"><span id="day">Day 1</span>·<b id="clock">08:00</b><button class="lvbadge" id="mLv" data-a="goMore" aria-label="Studio level"></button><span id="mShard" class="lvbadge" hidden></span></div>
        <div class="cash" id="cash">€0</div>
      </div>
      <div class="daybtns">
        <button class="btn ghost ico" id="pauseBtn" data-a="pause" aria-label="Pause"></button>
        <button class="btn ghost stk" id="waitBtn" data-a="wait">+2 h</button>
      </div>
    </div>
    <div class="statline"><span>Rating <b id="mRating">–</b></span><span>Hype <b id="mHype">–</b></span><span id="mPay"></span></div>
    <div class="energy">
      <span class="lab"><svg class="bolt" viewBox="0 0 10 14" aria-hidden="true"><path d="M6 0 0 8h4l-1 6 7-9H6z" fill="currentColor"/></svg>Energy</span>
      <div class="bar"><i id="mEnergyBar" style="width:100%"></i></div>
      <span class="val" id="mEnergy">100/100</span>
      <button class="linkbtn" id="drinkBtn" data-a="drink">+ Drink</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<nav><div class="in" id="tabs">
  <button data-tab="studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 12h6v4H9z"/></svg>Studio</button>
  <button data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Orders</button>
  <button data-tab="buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M4 7h16l-1.5 13h-13z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Buy</button>
  <button data-tab="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5"/></svg>Team</button>
  <button data-tab="empire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/></svg>Empire</button>
</div></nav>
<div id="modalRoot"></div>
<div class="toast" id="toast" style="opacity:0" aria-live="polite"></div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/simulation.js"></script>
<script src="js/actions.js"></script>
<script src="js/expansions.js"></script>
<script src="js/art.js"></script>
<script src="js/official.js"></script>
<script src="js/images.js"></script>
<script src="js/patch-notes.js"></script>
<script src="js/progression.js"></script>
<script src="js/vault.js"></script>
<script src="js/energy.js"></script>
<script src="js/inventory.js"></script>
<script src="js/rebirth.js"></script>
<script src="js/world.js"></script>
<script src="js/viewer3d.js"></script>
<script src="js/views.js"></script>
<script src="js/machines.js"></script>
<script src="js/main.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
