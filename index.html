<body>

<div class="wrap">
  <header>
    <div class="top">
      <div>
        <div class="meta"><span id="day">Day 1</span>·<b id="clock">08:00</b><button class="lvbadge" id="mLv" data-a="goMore" aria-label="Studio level"></button><span id="mShard" class="lvbadge" hidden></span></div>
        <div class="cash" id="cash">€0</div>
      </div>
      <div class="daybtns">
        <button class="btn ghost ico" id="pauseBtn" data-a="pause" aria-label="Pause"></button>
        <button class="btn ghost stk" id="waitBtn" data-a="wait">+2 h</button>
      </div>
    </div>
    <div class="pills"><span class="pill star"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1.5l1.9 4 4.4.6-3.2 3 .8 4.3L8 11.3 4.1 13.4l.8-4.3-3.2-3 4.4-.6z"/></svg><b id="mRating">–</b></span><span class="pill hype"><svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 1c.5 2.4 3.5 3.8 3.5 7a3.5 3.5 0 0 1-7 0c0-1.2.5-2 1.2-2.8C6 6.5 6.6 7 7 7c0-2-.3-3.5 1-6z"/></svg><b id="mHype">–</b></span><span class="pill pay"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="2" y="3" width="12" height="11" rx="1.5"/><path d="M2 7h12M5 1.5v3M11 1.5v3"/></svg><span id="mPay"></span></span></div>
    <div class="energy">
      <span class="lab"><svg class="bolt" viewBox="0 0 10 14" aria-hidden="true"><path d="M6 0 0 8h4l-1 6 7-9H6z" fill="currentColor"/></svg>Energy</span>
      <div class="bar"><i id="mEnergyBar" style="width:100%"></i></div>
      <span class="val" id="mEnergy">100/100</span>
      <button class="linkbtn" id="drinkBtn" data-a="drink">+ Drink</button>
    </div>
    <button class="goal" id="goal" data-a="goGoal" aria-label="Current goal"></button>
  </header>
  <main id="main"></main>
</div>

<nav><div class="in" id="tabs">
  <button data-tab="studio"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 7h6M9 12h6v4H9z"/></svg>Studio</button>
  <button data-tab="orders"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M3 8l9-5 9 5v8l-9 5-9-5z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Orders</button>
  <button data-tab="buy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M4 7h16l-1.5 13h-13z"/><path d="M9 7a3 3 0 0 1 6 0"/></svg>Shop</button>
  <button data-tab="team"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.4"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M15 14.5c3 0 6 1.8 6 5"/></svg>Team</button>
  <button data-tab="empire"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="miter"><path d="M3 21h18M5 21V10l7-5 7 5v11"/><path d="M10 21v-6h4v6"/></svg>Empire</button>
</div></nav>
