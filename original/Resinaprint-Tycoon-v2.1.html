<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>Resinaprint Tycoon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@400;500;700;800&family=Chakra+Petch:wght@500;600;700&display=swap">
<style>
/* Layout: turn-based phone game. Compact sticky status header, one calm scrolling column of grouped lists, fixed tab bar.
   Single dark "studio at night" look by choice: ink-violet ground, resin amber for actions, UV violet for anything printing. */
:root{
  --bg:#0c0b13; --card:#16141f; --card2:#201d2c; --hair:rgba(255,255,255,.07);
  --ink:#f2effa; --muted:#9b96ad; --faint:#625d74;
  --amber:#ffb547; --amber-ink:#2b1a03; --amber-soft:rgba(255,181,71,.12);
  --uv:#9d89ff; --uv-soft:rgba(157,137,255,.14);
  --good:#5bd6a6; --bad:#ff6d82; --warn:#ffd166;
  --f-display:"Dela Gothic One","Arial Black",system-ui,sans-serif;
  --f-body:"M PLUS Rounded 1c",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Chakra Petch",ui-monospace,"SF Mono",monospace;
  --r:18px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(120% 60% at 100% 0%,rgba(157,137,255,.10),transparent 60%);background-attachment:fixed}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:0 104px}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin-inline:-16px;padding:12px 16px 12px;background:rgba(12,11,19,.88);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--hair)}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.meta{font-size:12px;color:var(--muted);font-weight:700;display:flex;gap:6px;align-items:center}
.meta b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.cash{font-family:var(--f-display);font-size:28px;line-height:1.15;letter-spacing:.01em;font-variant-numeric:tabular-nums}
.cash.neg{color:var(--bad)}
.daybtns{display:flex;gap:6px}
.statline{display:flex;gap:14px;margin-top:8px;font-size:12.5px;color:var(--muted);font-weight:700;flex-wrap:wrap}
.statline b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.energy{display:flex;align-items:center;gap:10px;margin-top:8px}
.energy .lab{font-size:12px;font-weight:800;color:var(--muted);display:flex;align-items:center;gap:4px}
.energy .bar{flex:1;height:5px}
.energy .val{font-family:var(--f-num);font-size:12.5px;min-width:56px;text-align:right}
.linkbtn{background:none;border:0;padding:2px 0;color:var(--amber);font-size:12px;font-weight:800}
.linkbtn:disabled{color:var(--faint);cursor:not-allowed}

/* structure */
.label{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:26px 4px 10px;font-size:11.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.label small{letter-spacing:0;text-transform:none;font-weight:700;color:var(--faint);font-size:12px}
.card{background:var(--card);border-radius:var(--r);padding:16px}
.stack{display:grid;gap:10px}
.group{background:var(--card);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;min-height:58px}
.item+.item{border-top:1px solid var(--hair)}
.grow{flex:1;min-width:0}
.t{font-weight:800;font-size:14.5px;line-height:1.3}
.s{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}
.f{color:var(--faint)}
.good{color:var(--good)} .bad{color:var(--bad)} .amber{color:var(--amber)} .uvc{color:var(--uv)}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:22px 16px}

/* controls */
.btn{background:var(--card2);border:0;border-radius:12px;padding:9px 14px;font-weight:800;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:38px}
.btn.primary{background:var(--amber);color:var(--amber-ink)}
.btn.uv{background:var(--uv);color:#160f2e}
.btn.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--hair)}
.btn.sm{padding:6px 11px;font-size:12.5px;min-height:32px;border-radius:10px}
.btn:disabled{opacity:.38;cursor:not-allowed}
.e{display:inline-flex;align-items:center;gap:2px;font-family:var(--f-num);font-size:11.5px;opacity:.8;font-weight:600}
.bolt{width:7px;height:10px}
.bar{height:6px;border-radius:9px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--good);transition:width .3s}
select.sel{width:auto;max-width:140px;flex:0 0 auto}
select{background:var(--card2);border:0;border-radius:10px;padding:9px 10px;font-size:13px;font-weight:700;width:100%;min-width:0}
.chip{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--muted);vertical-align:1px}
.chip.good{background:rgba(91,214,166,.12);color:var(--good)}
.chip.bad{background:rgba(255,109,130,.13);color:var(--bad)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.chip.uv{background:var(--uv-soft);color:var(--uv)}
.seg{display:flex;gap:2px;background:var(--card);border-radius:14px;padding:4px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
.seg button{flex:1;background:none;border:0;padding:9px 8px;border-radius:10px;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--card2);color:var(--ink)}
.seg .n{display:inline-block;min-width:17px;padding:0 5px;margin-left:5px;border-radius:9px;background:var(--bad);color:#2a0710;font-size:10.5px;line-height:17px}

/* workbench */
.flow{display:grid;grid-template-columns:repeat(4,1fr);position:relative;margin-bottom:14px}
.flow::before{content:"";position:absolute;left:12.5%;right:12.5%;top:17px;height:2px;background:var(--hair)}
.flow div{text-align:center;position:relative}
.flow b{display:grid;place-items:center;width:36px;height:36px;margin:0 auto 4px;border-radius:12px;background:var(--card2);font-family:var(--f-num);font-size:16px;position:relative}
.flow .hot b{background:var(--amber-soft);color:var(--amber)}
.flow span{font-size:11px;color:var(--muted);font-weight:700}
.tasks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.task{background:var(--card2);border:0;border-radius:14px;padding:12px 6px 10px;display:grid;gap:3px;text-align:center;min-width:0}
.task strong{font-size:13px}
.task span{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.go{background:var(--amber);color:var(--amber-ink)}
.task.go span{color:#6b4612}
.task:disabled{opacity:.4;cursor:not-allowed}

/* printers */
.pr{padding:14px 16px;min-width:0;overflow:hidden}
.pr-row{display:flex;align-items:center;gap:12px}
.art{width:44px;height:44px;flex:none;border-radius:12px;background:var(--card2);position:relative;overflow:hidden}.art svg{width:100%;height:100%;display:block}.art.idle{filter:grayscale(.85);opacity:.6}.art.run::before{content:;position:absolute;inset:0;background:var(--uv);opacity:0;animation:uv 1.4s infinite;z-index:1;mix-blend-mode:screen}.art .lvl{position:absolute;left:0;bottom:0;top:auto;width:4px;height:var(--lv,50%);background:linear-gradient(var(--amber),#cc7a26);opacity:.8}.art.form .lvl{background:linear-gradient(#d2cbee,#8a80b0)}.item .art{width:40px;height:40px}.item .art.prod{width:60px;height:60px}
.vat{width:40px;height:40px;flex:none;border-radius:12px;background:var(--amber-soft);position:relative;overflow:hidden}
.vat::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--lv,50%);background:linear-gradient(var(--amber),#cc7a26);opacity:.65}
.vat.form{background:var(--uv-soft)}
.vat.form::after{background:linear-gradient(#d2cbee,#8a80b0)}
.vat.idle{filter:grayscale(.85);opacity:.55}
.vat.run::before{content:"";position:absolute;inset:0;background:var(--uv);opacity:0;animation:uv 1.4s infinite;z-index:1;mix-blend-mode:screen}
@keyframes uv{0%,55%{opacity:0}65%{opacity:.6}100%{opacity:0}}
.pr .bar{margin-top:12px;height:4px}
.pr-meta{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--muted)}
.pr-meta span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pr-meta span:first-child{flex:0 1 auto}
.pr-meta span:nth-child(2){flex:none}
.more{margin-left:auto;background:none;border:0;color:var(--muted);font-size:12px;font-weight:800;display:inline-flex;align-items:center;gap:4px;padding:4px 0;flex:none}
.more svg{width:12px;height:12px;transition:transform .2s}
.more.open svg{transform:rotate(180deg)}
.drawer{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--hair)}
.drawer label{font-size:11px;font-weight:800;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;display:grid;gap:4px}

/* misc */
.stepper{display:flex;align-items:center;gap:4px}
.stepper b{min-width:54px;text-align:center;font-family:var(--f-num)}
.stepper .btn{width:32px;padding:0}
.opts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.kv{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:8px}
.kv b{color:var(--ink);font-family:var(--f-num);font-weight:600}
.ms{display:flex;gap:12px;align-items:center}
.ms i{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.5px var(--hair);flex:none;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:800}
.ms.done i{background:var(--good);box-shadow:none;color:#06291d}
.ms.done .t{color:var(--muted);font-weight:700}
.logd{font-family:var(--f-num);color:var(--faint);font-size:12px;width:34px;flex:none;align-self:flex-start;padding-top:1px}

/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:rgba(14,13,22,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--hair);padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav button{background:none;border:0;padding:10px 2px 9px;font-size:11px;font-weight:800;color:var(--faint);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
nav button svg{width:22px;height:22px}
nav button.on{color:var(--ink)}
nav button.on svg{color:var(--amber)}
nav .dot{position:absolute;top:6px;left:calc(50% + 6px);min-width:16px;height:16px;padding:0 4px;border-radius:9px;background:var(--bad);color:#2a0710;font-size:10px;line-height:16px;font-family:var(--f-num)}

/* modal & report */
.modal{position:fixed;inset:0;z-index:10;background:rgba(5,4,10,.7);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center;padding:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
.sheet{background:var(--card);border-radius:24px;padding:22px 20px 20px;max-width:460px;width:100%;max-height:100%;overflow-y:auto;box-shadow:0 30px 80px rgba(0,0,0,.55);border:1px solid var(--hair)}
.sheet h3{font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.25;margin:0 0 8px;text-wrap:balance}
.sheet p{margin:0 0 14px;color:var(--muted)}
.sheet ul{margin:0 0 16px;padding-left:18px;color:var(--muted);font-size:14px;display:grid;gap:4px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts .btn{flex:1;min-height:48px;font-size:14.5px}
.kicker{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;margin-bottom:10px}
.rep-top{text-align:center;padding:4px 0 6px}
.rep-eyebrow{font-size:11.5px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:800}
.rep-profit{font-family:var(--f-display);font-size:42px;line-height:1.1;margin:6px 0 6px}
.rep-sub{font-size:13px;color:var(--muted)}
.rep-sec{margin-top:18px}
.rep-sec h4{margin:0 0 8px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted)}
.ledger{background:var(--card2);border-radius:14px;padding:4px 14px}
.ledger div{display:flex;justify-content:space-between;gap:10px;padding:9px 0;font-size:14px}
.ledger div+div{border-top:1px solid var(--hair)}
.ledger .tot{font-weight:800}
.ledger .num{font-weight:600}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.grid4 div{background:var(--card2);border-radius:12px;padding:10px 4px;text-align:center}
.grid4 b{display:block;font-family:var(--f-num);font-size:20px}
.grid4 span{font-size:10.5px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(80px + env(safe-area-inset-bottom,0px));z-index:9;background:#2a2638;padding:10px 16px;border-radius:14px;font-size:13px;font-weight:800;max-width:calc(100% - 32px);text-align:center;transition:opacity .25s;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.btn small{font-size:10.5px;font-weight:700;opacity:.75;font-family:var(--f-num)}
.btn.stk{flex-direction:column;gap:1px;padding:5px 12px;line-height:1.15;min-height:40px}
.btn.ico{padding:0;width:40px;min-height:40px}
.btn.ico svg{width:16px;height:16px}
.btn.ico.on{background:var(--amber);color:var(--amber-ink)}
.acts .btn:has(small){flex-basis:100%;flex-direction:column;gap:3px;white-space:normal;text-align:center;padding:10px 14px}
.acts .btn small{font-family:inherit;font-size:11.5px;font-weight:600;opacity:.8}
.drawer label.chk{grid-column:1/-1;display:flex;align-items:center;gap:8px;text-transform:none;letter-spacing:0;font-size:12.5px;color:var(--muted);font-weight:700}
.drawer label.chk input{width:18px;height:18px;accent-color:var(--amber)}
.tm{display:grid;gap:7px;margin-top:8px}
.tm .row{display:flex;gap:8px;align-items:center}
.tm .bar{height:4px;flex:1}
.tm .lv{font-family:var(--f-num);font-size:11.5px;color:var(--muted);min-width:34px}
.tm .act{font-size:12px;color:var(--uv);font-weight:700}
.bonus{display:flex;flex-wrap:wrap;gap:6px}
@media (prefers-reduced-motion:reduce){.vat.run::before,.art.run::before{animation:none}.toast,.bar i,.more svg{transition:none}}
@media (max-width:370px){.cash{font-size:24px}.daybtns .btn{padding:8px 10px}.task strong{font-size:12px}}

/* ===== 2.0 look ===== */
:root{--bg:#090912;--card:#15141f;--card2:#201e2e;--hair:rgba(255,255,255,.08);--r:22px;
 --amber2:#ff8a3d;--grad:linear-gradient(135deg,var(--amber),var(--amber2));--glow:0 8px 26px rgba(255,150,60,.26)}
:root[data-theme=sakura]{--amber:#ff7eb6;--amber2:#ff5a8f;--amber-ink:#2a0716;--amber-soft:rgba(255,126,182,.15);--uv:#b79bff;--glow:0 8px 26px rgba(255,100,160,.3)}
:root[data-theme=mint]{--amber:#4fe3b0;--amber2:#1fc48f;--amber-ink:#03231a;--amber-soft:rgba(79,227,176,.14);--uv:#7fb8ff;--glow:0 8px 26px rgba(40,210,150,.26)}
:root[data-theme=ice]{--amber:#6fb7ff;--amber2:#4a8dff;--amber-ink:#04162b;--amber-soft:rgba(111,183,255,.15);--uv:#c0a6ff;--glow:0 8px 26px rgba(80,150,255,.28)}
body{background-image:radial-gradient(90% 46% at 88% -6%,color-mix(in srgb,var(--uv) 24%,transparent),transparent 62%),radial-gradient(70% 40% at -12% 34%,color-mix(in srgb,var(--amber) 9%,transparent),transparent 60%)}
.wrap{padding-block:0 128px}
header{background:linear-gradient(180deg,rgba(14,13,24,.95),rgba(14,13,24,.86));border-bottom:1px solid var(--hair);box-shadow:0 10px 30px rgba(0,0,0,.35)}
header::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--amber),transparent);opacity:.5}
.cash{background:linear-gradient(180deg,#fff,#cdc6ee);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.cash.neg{background:none;color:var(--bad);-webkit-text-fill-color:currentColor}
.statline{gap:6px}
.statline span{background:rgba(255,255,255,.05);padding:3px 10px;border-radius:99px}
.lvbadge{white-space:nowrap;margin-left:4px;padding:2px 9px;border-radius:99px;border:0;background:linear-gradient(90deg,color-mix(in srgb,var(--amber) 38%,transparent) var(--xp,0%),rgba(255,255,255,.06) var(--xp,0%));color:var(--ink);font-family:var(--f-num);font-size:12px;font-weight:700}
.energy .bar{height:6px}
.card,.group{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),var(--card);border:1px solid var(--hair);box-shadow:0 10px 28px rgba(0,0,0,.26)}
.label{position:relative;padding-left:14px}
.label::before{content:"";position:absolute;left:2px;top:50%;width:4px;height:13px;margin-top:-6px;border-radius:3px;background:var(--grad)}
.btn{transition:transform .12s,box-shadow .2s,background .2s}
.btn:active:not(:disabled){transform:scale(.95)}
.btn.primary{background:var(--grad);box-shadow:var(--glow)}
.btn.uv{background:linear-gradient(135deg,var(--uv),#7a64e8);box-shadow:0 8px 24px rgba(130,100,255,.24)}
.btn.ghost{box-shadow:inset 0 0 0 1px rgba(255,255,255,.12)}
.btn.ico.on{background:var(--grad)}
.task.go{background:var(--grad);box-shadow:var(--glow)}
.seg{background:rgba(255,255,255,.04);border:1px solid var(--hair);border-radius:16px}
.seg button{border-radius:12px;transition:background .2s,color .2s}
.seg button.on{background:var(--grad);color:var(--amber-ink);box-shadow:var(--glow)}
.chip{border:1px solid var(--hair)}
.bar i{background:linear-gradient(90deg,var(--good),#9be8c6)}
nav{left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border-radius:26px;border:1px solid rgba(255,255,255,.1);background:rgba(16,15,26,.9);box-shadow:0 14px 44px rgba(0,0,0,.55);padding-bottom:0}
nav .in{max-width:620px}
nav button{isolation:isolate;transition:color .2s}
nav button::before{content:"";position:absolute;inset:5px 5px;border-radius:18px;background:var(--amber-soft);opacity:0;transform:scale(.85);transition:opacity .2s,transform .2s;z-index:-1}
nav button.on::before{opacity:1;transform:none}
.toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
.art{width:52px;height:52px;border-radius:16px;background:radial-gradient(120% 100% at 50% 0%,rgba(255,255,255,.1),rgba(255,255,255,.02)),var(--card2);border:1px solid var(--hair)}
.item .art{width:44px;height:44px;border-radius:14px}
.item .art.prod{width:54px;height:54px;border-radius:16px}
.pr{transition:box-shadow .3s,border-color .3s}
.pr:has(.art.run){border-color:rgba(157,137,255,.4);box-shadow:0 0 0 1px rgba(157,137,255,.25),0 12px 38px rgba(130,100,255,.2)}
.pr .bar i{background:linear-gradient(90deg,var(--uv),#d9ccff)}
.sheet{border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 140px),var(--card);border:1px solid rgba(255,255,255,.1);animation:pop .3s cubic-bezier(.2,.9,.3,1.15)}
@keyframes pop{from{transform:translateY(26px) scale(.96);opacity:0}}
.sheet h3{background:linear-gradient(90deg,#fff,color-mix(in srgb,var(--amber) 70%,#fff));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.kicker{display:inline-block;padding:3px 10px;border-radius:99px;background:var(--amber-soft)}
.pn{margin:0 0 6px}.pn h4{margin:10px 0 6px;font-size:11px;text-transform:uppercase;letter-spacing:.14em;color:var(--amber)}
.pn ul{margin:0 0 6px}.pn li b{color:var(--ink)}
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015)),var(--card);border:1px solid var(--hair);border-radius:18px;padding:14px 16px}
.stat b{display:block;font-family:var(--f-display);font-weight:400;font-size:21px;line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted);font-weight:700}
.lvbig{flex:none;width:58px;height:58px;border-radius:19px;display:grid;place-items:center;background:var(--grad);color:var(--amber-ink);font-family:var(--f-display);font-size:26px;box-shadow:var(--glow)}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}nav button::before,.btn{transition:none}}

.art.v3{cursor:pointer}.art.v3::after{content:"3D";position:absolute;right:3px;bottom:3px;z-index:2;padding:1px 5px;border-radius:7px;background:rgba(0,0,0,.6);color:#fff;font:700 8.5px var(--f-num);letter-spacing:.04em}
.v3d{position:relative;height:min(52vh,380px);margin:6px -8px 0;border-radius:22px;overflow:hidden;background:radial-gradient(70% 60% at 50% 62%,color-mix(in srgb,var(--uv) 30%,transparent),transparent 70%),linear-gradient(180deg,#0d0c16,#171426);border:1px solid var(--hair)}
.v3d canvas{width:100%;height:100%;display:block;cursor:grab}.v3d canvas:active{cursor:grabbing}.v3fb{position:absolute;inset:0;padding:30px}.v3fb svg{width:100%;height:100%}

/* ---------- clock (live) ---------- */
let simulating=false,queue=[],awayMode=false;
function sim(dt){
  const rate=printRate();
  S.abs+=dt;
  for(const p of S.printers)if(p.state==='printing'){p.job.left-=dt*rate;if(p.job.left<=0)endJob(p)}
  staffWork(dt);
  if(S.energy<maxE())S.energy=Math.min(maxE(),S.energy+regen()*dt);
  S.m+=dt*60;
  while(S.m>=60){S.m-=60;hourStep();if(S.over)return}
}
function hourStep(){
  S.hour++;
  if(S.hour>=24){S.hour=0;endOfDay();if(S.over)return}
  if(S.hour===7)S.drinks=0;
  clearanceDone();
  autoContracts();
  for(const k of PKEYS)if(sellable(k)){const P=S.pre[k],lt=!!(P&&P.on&&P.ltd);takeOrders(k,poisson(demand(k)*(lt?1.3:1)/24))}
  for(let i=S.orders.length-1;i>=0;i--){const o=S.orders[i];if(freeStock(o.p)>0&&CARRIERS[carrierFor(o.dest||'nl')].auto){S.orders.splice(i,1);ship(o);did('Orders packed by the fulfilment partner',1,true)}}
  if(S.parcels.length){const keep=[];for(const par of S.parcels){if(S.abs>=par.due)deliverParcel(par);else keep.push(par)}S.parcels=keep}
  if(S.hour>=8&&S.hour<23&&Math.random()<.025+S.orders.length*.004)newDM();
  if(S.hour===12&&S.day>3&&Math.random()<.28)randomEvent();
}
/* staff: every worker has a task cooldown and picks the most useful job on their own */
function gainXp(s,h){
  s.xp=(s.xp||0)+(h+.12)*(S.up.training?1.5:1)*(1+upv('xp'));
  while((s.lvl||1)<5&&s.xp>=XPN[(s.lvl||1)-1])levelUp(s);
}
function levelUp(s){s.lvl=(s.lvl||1)+1;s.wage=Math.round(s.wage*1.1);log(`${s.name} reached level ${s.lvl}. Works faster, wage now ${fmt(s.wage)}/day.`,'good')}
function techTask(s){
  for(const p of S.printers){
    if(p.state==='failed'){clean(p);did('Failed prints cleaned',1,true);return{h:.1,act:`Cleaning ${short(p)}`}}
    if(p.state==='done'){collect(p);did('Plates collected',1,true);return{h:.08,act:`Collecting a plate from ${short(p)}`}}
  }
  for(const p of S.printers){
    if(p.state!=='idle')continue;
    const D=PRINTERS[p.type];
    if(p.cond<25&&S.cash>serviceFee(p)*3&&service(p,true)){did('Printers serviced',1,true);return{h:.3,act:`Servicing ${short(p)}`}}
    if(p.auto!==false){const k=autoProd(p);if(!k)continue;p.prod=k}
    if(p.swap){const need=jobMl(p)-(D.form?0:p.vat);
      if(need>0&&(S.resin[p.resin]||0)<need){
        const alt=Object.keys(RESINS).filter(k=>RESINS[k].fam===D.fam&&k!==p.resin&&(S.resin[k]||0)>=need).sort((a,b)=>(S.resin[b]||0)-(S.resin[a]||0))[0];
        if(alt){const was=RESINS[p.resin].name;p.resin=alt;did('Resins switched',1,true);log(`${short(p)} ran out of ${was} and switched to ${RESINS[alt].name}.`,'amber');return{h:.05,act:`Switching ${short(p)} to ${RESINS[alt].name}`}}
      }}
    if(!D.form&&p.vat<jobMl(p)&&refill(p)){did('Vats refilled',1,true);return{h:.1,act:`Refilling ${short(p)}`}}
    if(startJob(p,true)){did('Prints started',1,true);return{h:.06,act:`Starting a print on ${short(p)}`}}
    if(S.warnDay!==S.day&&!whyNot(p,p.prod)&&(S.resin[p.resin]||0)<jobMl(p)&&p.cond>0){S.warnDay=S.day;log(`Out of ${RESINS[p.resin].name}. Technicians are waiting on supplies.`,'bad')}
  }
  return null;
}
function haveStock(k){return S.stock[k]+S.cured[k]+S.unwashed[k]+S.printers.reduce((a,q)=>a+(q.state!=='idle'&&q.job&&q.job.prod===k?q.job.units:0),0)}
function staffTask(s){
  if(s.role==='tech')return techTask(s);
  if(s.role==='post'){if(totUnwashed()>0){const n=wash();did('Batches washed',1,true);return{h:.45,act:`Washing and curing ${n} prints`}}return null}
  if(s.role==='painter'){const k=nextFinish();if(!k)return null;finishOne(k);did('Figures finished',1,true);return{h:Math.max(.12,PRODUCTS[k].effort*.45/skill(s)*(s.trait==='efficient'?.8:1)*paintMult()*(S.crunch?.75:1)),act:`Finishing a ${PRODUCTS[k].name.toLowerCase()}`}}
  if(s.role==='packer'){if(packableIdx()<0)return null;packOne();did('Orders packed',1,true);return{h:.3,act:'Packing an order'}}
  if(s.role==='support'){const d=S.dms[0];if(!d)return null;const opts=dmOpts(d);const i=opts.findIndex(o=>!o.ok||o.ok());answerDM(d.id,i<0?opts.length-1:i,true);if(s.trait==='efficient')S.hype+=.5;return{h:.25,act:'Answering a message'}}
  if(s.role==='engineer'){for(const p of S.printers)if(p.state==='idle'&&p.cond<60&&S.cash>serviceFee(p)*2&&service(p,true)){did('Printers serviced',1,true);return{h:.4,act:`Servicing ${short(p)}`}}return null}
  if(s.role==='buyer'){
    for(const k of new Set(S.printers.map(p=>p.resin))){const vol=RESINS[k].vol||1000;if((S.resin[k]||0)<vol*.8){const c=resinPrice(k)*(s.trait==='efficient'?.94:1);if(S.cash>c*3){spend('Resin',c);S.resin[k]=(S.resin[k]||0)+vol;did('Supplies ordered',1,true);return{h:.3,act:`Ordering ${RESINS[k].name}`}}}}
    return null}
  if(s.role==='salesrep'){
    for(const c of S.contracts)if(S.stock[c.p]>=c.qty){deliverContract(c,true);return{h:.3,act:`Delivering to ${c.client}`}}
    if(S.contracts.length<4){const o=S.offers.find(o=>haveStock(o.p)>=Math.min(o.qty,6)||o.qty<=6);if(o){acceptOffer(o);did('Contracts signed',1,true);return{h:.4,act:`Signing a deal with ${o.client}`}}}
    return null}
  return null;
}
function staffWork(dt){
  const [a,b]=shift(),on=S.hour>=a&&S.hour<b;
  for(const s of S.staff){
    if(s.role==='clerk')continue;
    if(!on){s.act='Off shift';s.cd=0;continue}
    if(PASSIVE[s.role]){s.act=PASSIVE[s.role];s.busy+=dt*.5;gainXp(s,dt*.5);continue}
    s.cd-=dt;
    let n=0;
    while(s.cd<=0&&n++<12){
      const t=staffTask(s);
      if(!t){s.cd=0;s.act='Waiting for work';break}
      const d=t.h/(skill(s)*mf(s));
      s.cd+=d;s.busy+=d;s.act=t.act;gainXp(s,d);
    }
  }
}

function storesDay(){
  for(const k in S.stores){const st=S.stores[k],D=STORES[k];if(!st.open)continue;

    if(!clerks.length&&S.shift[k]!==S.day)continue;
    const mult=LVL[st.level-1]*(1+S.hype/80);
    const sold=Math.min(st.stock,Math.round(poisson(D.traffic*mult)*1.3));
    st.stock-=sold;
    if(sold){earn('Store sales',sold*D.sell);S.revenue+=sold*D.sell}
    st.last=sold*D.sell;
    if(st.merged&&k==='manga'){const walk=poisson(D.traffic*mult*.06);let f=0;for(let i=0;i<walk;i++){const ks=PKEYS.filter(p=>S.stock[p]>0&&S.listed[p]);if(!ks.length)break;ship({p:pick(ks),age:0},true);f++}if(f)log(`${f} figure${f>1?'s':''} sold at the manga store counter.`,'good')}

    if(clerks.length&&st.stock<cap*.4){const want=Math.floor(cap*.8)-st.stock,c=want*D.unit;if(S.cash>c+500){spend('Store stock',c);st.stock+=want}}

  }
}

function liveTick(){
  if(!S||!S.started||S.over)return;
  const now=Date.now();let gap=now-(S.lastT||now);S.lastT=now;
  if(gap<=0)return;
  if(S.paused||modalOpen())return;
  if(gap>4000){ // you were away: the shop kept running
    const h=Math.min(MAX_AWAY,gap/HOUR_MS);
    S.rep=newRep(S);S.rep.hours=h;
    awayMode=true;advance(h);awayMode=false;S.lastT=Date.now();
    if(S.over){S.over=false;S.cash=Math.max(S.cash,-1400);log('The bank froze your account while you were away. Sort out your finances before it closes it.','bad')}
    save();render();
    const go=()=>{if(h>=.5)showAway(h);else nextQueued()};if(patchDue())showPatch(go);else go();
    return;
  }
  const dt=gap/HOUR_MS;
  simulating=true;let left=dt;while(left>1e-9&&!S.over){const d=Math.min(.05,left);sim(d);left-=d}simulating=false;
  S.lastT=Date.now();
  if(now-(liveTick.saved||0)>10000){liveTick.saved=now;save()}
  render();
  if(S.over){gameOver();return}
  if(queue.length)nextQueued();
}

  <div class="rep-sec"><h4>Earned</h4>${ledger(inc,'+',ti,'Total')}</div>
  <div class="rep-sec"><h4>Paid</h4>${ledger(exp,'−',te,'Total')}</div>

function takeOrders(k,n,wom){
  if(!sellable(k)||n<=0)return 0;
  const P=S.clear[k]?null:S.pre[k],lt=!!(P&&P.on&&P.ltd);
  const open=S.orders.filter(o=>o.p===k).length,fs=freeStock(k),cover=Math.max(0,fs-open),backlog=Math.max(0,open-fs);
  const room=lt?P.cap:cover+(P&&P.on?Math.max(0,P.cap-backlog):0),take=Math.min(n,room);
  for(let i=0;i<take;i++){const pre=lt||i>=cover;S.orders.push({id:nid(),p:k,age:0,dest:pickDest(),ch:pickChan(),pre,rush:!pre&&Math.random()<.08});if(lt)P.cap--}
  if(!wom){S.rep.newOrders+=take;if(n>take)S.rep.soldout=(S.rep.soldout||0)+n-take}
  if(lt&&P.cap<=0){P.on=false;P.ltd=false;P.cap=10;S.listed[k]=false;log(`Limited run of ${PRODUCTS[k].name} sold out. It is unlisted.`,'good')}

}

const RIMG={};
const _prodArt=prodArt,_printerArt=printerArt;
prodArt=function(k){return PIMG[k]?`<img src="${PIMG[k]}" alt="" style="width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block">`:_prodArt(k)};

/* ---------- 2.0: levels, trends, difficulty, stats, themes, patch notes ---------- */
const VERSION='2.1';
const PATCH_TITLE='Resinaprint 2.1 · 3D Update';
const PATCH=[
 {h:'New',i:[
  '<b>3D view.</b> Tap any printer or figure picture (the little 3D badge) to open it in 3D. Drag to turn it around. Printers glow while they print, figures stand on a glowing base.',
  '<b>Auto-deliver contracts.</b> Each contract has an Auto-deliver button. Your stock stays held for it and it is sent the moment all figures are ready.',
  '<b>Everything from 2.0:</b>',
  '<b>Studio level.</b> Every figure you ship earns XP. Each level pays cash, adds a little demand (up to +30%), and every 5th level gives +10 max energy.',
  '<b>Trending products.</b> Each week one of your figures is hot (+45% demand) and another cools off (−30%). Check the chips on the Studio tab and plan your printers around it.',
  '<b>Difficulty.</b> Chill, Normal or Hard. It changes demand, wages, failures and how hard bad events hit. Find it under Empire › More.',
  '<b>Stats screen.</b> Best sellers, deliveries, peak cash and more under Empire › More.',
  '<b>Colour themes.</b> Resin amber, Sakura, Mint and Ice.',
  '<b>Pictures.</b> Every printer and every product now has its own picture, and Ahri and the garage kit use your real photos.'
 ]},
 {h:'Improved',i:[
  'Whole new look: glass cards, gradient buttons, a floating tab bar, bigger printer pictures and a glowing card while a printer is running.',
  'Printers and products are drawn per model, in elegant anime style instead of chibi.',
  'This patch-notes popup shows once per update. You can read it again under Empire › More.'
 ]},
 {h:'Fixed',i:[
  'Printers with a small vat (like the Sonic Mighty Revo) can be refilled and started again. Batches never exceed the vat size.',
  'Contracts only appear for figures you list and still make.'
 ]}
];
function patchHTML(){return `<div class="kicker">Update ${VERSION}</div><h3>${PATCH_TITLE}</h3><p>New update! Here is what changed.</p>${PATCH.map(g=>`<div class="pn"><h4>${g.h}</h4><ul>${g.i.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('')}<div class="acts"><button class="btn primary" data-choice="0">Let's go</button></div>`}
const patchDue=()=>!!S&&S.started&&!S.over&&S.seenVer!==VERSION;
function showPatch(after){pending=[{f:()=>{S.seenVer=VERSION;if(typeof after==='function')after()}}];modal(patchHTML())}
function maybePatchNotes(){
  if(!S||!S.started||S.over||S.seenVer===VERSION)return;
  if(Date.now()-(S.lastT||0)>4000){setTimeout(maybePatchNotes,500);return}
  if(modalOpen()){if(!queue.some(q=>q.patch))queue.push({patch:1});return}
  showPatch();
}

/* ---- studio level ---- */
const XP_NEED=l=>Math.round(30*Math.pow(l,1.55)+20);
const lvDem=()=>Math.min(.3,.01*(((S&&S.lv)||1)-1));
const lvEnergy=()=>Math.floor((((S&&S.lv)||1)-1)/5)*10;
function addXp(n){
  if(!S||n<=0)return;
  S.lv=S.lv||1;S.xp=(S.xp||0)+n;
  while(S.xp>=XP_NEED(S.lv)){
    S.xp-=XP_NEED(S.lv);S.lv++;
    const rw=40*S.lv;earn('Level rewards',rw);S.hype+=2;
    log(`Studio level ${S.lv}! +${fmt(rw)}${S.lv%5===0?' and +10 max energy':''}. Demand bonus is now +${Math.round(lvDem()*100)}%.`,'good');
    if(!simulating&&!awayMode)toast(`Level ${S.lv}! +${fmt(rw)}`);
  }
}
function levelDay(){
  const d=(S.contractsDone||0)-(S.cdSeen||0);S.cdSeen=S.contractsDone||0;
  if(d>0)addXp(d*10);
}

/* ---- trends ---- */
function newTrend(){
  const ks=PKEYS.filter(k=>unlocked(k)&&makeable(k)&&S.listed[k]&&!S.stop[k]);
  const sh=[...ks].sort(()=>Math.random()-.5);
  const old=S.trend;let up=sh.find(k=>!old||k!==old.up)||sh[0];
  let down=sh.find(k=>k!==up);
  S.trend={up:up||null,down:ks.length>=3?down||null:null,until:S.day+7};
  if(S.trend.up)log(`Trending this week: ${PRODUCTS[S.trend.up].name} (+45% demand)${S.trend.down?`. Cooling off: ${PRODUCTS[S.trend.down].name} (−30%)`:''}.`,'amber');
}
function trendDay(){if(!S.trend||S.day>=S.trend.until)newTrend()}
const trendMult=k=>{const t=S&&S.trend;return t?(t.up===k?1.45:t.down===k?.7:1):1};

/* ---- difficulty ---- */
const DIFFS={chill:{n:'Chill',dem:1.12,hit:.6,wage:.9,fail:.9,d:'More demand, softer bad events, cheaper wages'},normal:{n:'Normal',dem:1,hit:1,wage:1,fail:1,d:'The standard game'},hard:{n:'Hard',dem:.92,hit:1.4,wage:1.1,fail:1.15,d:'Less demand, nastier events, pricier wages, more failed prints'}};
const diffM=()=>DIFFS[(S&&S.diff)||'normal']||DIFFS.normal;
const THEMES={amber:'Resin amber',sakura:'Sakura',mint:'Mint',ice:'Ice'};
function applyTheme(){const t=(S&&S.theme)||'amber';const de=document.documentElement;if(de&&de.dataset&&de.dataset.theme!==t)de.dataset.theme=t}

/* ---- header level badge ---- */
function renderLv(){
  applyTheme();
  const el=document.getElementById('mLv');if(!el||!S)return;
  const lv=S.lv||1,p=Math.min(100,Math.round((S.xp||0)/XP_NEED(lv)*100));
  const h='Lv '+lv;
  if(el._h!==h){el.textContent=h;el._h=h}
  if(el.style.setProperty)el.style.setProperty('--xp',p+'%');
}

/* ---- More tab: level, stats, settings ---- */
function moreView(){
  const lv=S.lv||1,need=XP_NEED(lv),xp=S.xp||0;
  let h=label('Studio level',`${Math.round(xp)} / ${need} XP`)+`<div class="card"><div style="display:flex;align-items:center;gap:14px"><div class="lvbig">${lv}</div><div class="grow"><div class="t">Level ${lv}</div><div class="s">+${Math.round(lvDem()*100)}% demand · +${lvEnergy()} max energy · next level pays ${fmt(40*(lv+1))}</div><div class="bar" style="margin-top:10px"><i style="width:${Math.min(100,xp/need*100)}%;background:var(--grad)"></i></div></div></div><div class="s" style="margin-top:10px">Shipping a figure gives 1 XP. Daily goals give 5, finished contracts 10.</div></div>`;
  const by=Object.entries(S.soldBy||{}).sort((a,b)=>b[1]-a[1]).filter(e=>PRODUCTS[e[0]]).slice(0,5);
  const peak=Math.max(S.cash,...(S.hist||[0]));
  h+=label('Stats')+`<div class="statgrid">
   <div class="stat"><b>${S.day}</b><span>Days played</span></div>
   <div class="stat"><b>${S.sold}</b><span>Figures sold</span></div>
   <div class="stat"><b>${fmt(S.revenue)}</b><span>Revenue</span></div>
   <div class="stat"><b>${fmt(peak)}</b><span>Peak cash (30 days)</span></div>
   <div class="stat"><b>${S.rating.toFixed(2)}★</b><span>${S.reviews} reviews</span></div>
   <div class="stat"><b>${S.contractsDone||0}</b><span>Contracts done</span></div>
   <div class="stat"><b>${S.printers.length}</b><span>Printers</span></div>
   <div class="stat"><b>${S.staff.length}</b><span>Staff</span></div></div>`;
  const ds=S.dstat||{};
  h+=label('Parcels')+`<div class="card"><div class="kv" style="margin:0"><span>Sent <b>${ds.sent||0}</b></span><span>Delivered <b>${ds.del||0}</b></span><span>Lost <b>${ds.lost||0}</b></span><span>Damaged <b>${ds.dmg||0}</b></span></div></div>`;
  if(by.length){const mx=by[0][1];h+=label('Best sellers',`since 2.0`)+`<div class="group">${by.map(([k,n])=>`<div class="item">${artBox(prodArt(k),'','',['f',k])}<div class="grow"><div class="t">${PRODUCTS[k].name}</div><div class="bar" style="margin-top:7px;height:5px"><i style="width:${n/mx*100}%;background:var(--grad)"></i></div></div><b class="num">${n}</b></div>`).join('')}</div>`}
  h+=label('Difficulty')+`<div class="card"><div class="opts" style="margin:0">${Object.keys(DIFFS).map(k=>`<button class="btn sm ${(S.diff||'normal')===k?'primary':''}" data-a="diff" data-k="${k}">${DIFFS[k].n}</button>`).join('')}</div><div class="s" style="margin-top:10px">${diffM().d}.</div></div>`;
  h+=label('Theme')+`<div class="card"><div class="opts" style="margin:0">${Object.keys(THEMES).map(k=>`<button class="btn sm ${(S.theme||'amber')===k?'primary':''}" data-a="theme" data-k="${k}">${THEMES[k]}</button>`).join('')}</div></div>`;
  h+=label('About')+`<div class="card"><div class="t">Resinaprint Tycoon ${VERSION}</div><div class="s" style="margin-top:4px">${PATCH_TITLE}</div><div class="acts" style="margin-top:12px"><button class="btn sm" data-a="patchNotes">Read the patch notes</button></div></div>`;
  return h;
}
Object.assign(A,{
  diff(d){S.diff=d.k;toast(DIFFS[d.k].n+' difficulty')},
  theme(d){S.theme=d.k;applyTheme()},
  patchNotes(){showPatch()},
  goMore(){tab='empire';sub.empire='more'}

  const wl=weekly();h+=wl.map(([c,a])=>item(c,'',`<span class="num">${fmt(a)}</span>`)).join('')+item('Profit this week',`${b.form==='bv'?'Company':'Income'} tax estimate ${fmt(est)}`,`<span class="num ${b.wkInc-b.wkExp>=0?'good':'bad'}">${sfmt(b.wkInc-b.wkExp)}</span>`)+'</div>';
  h+=label('Permits','needed for bigger buildings')+`<div class="group">`+Object.keys(PERMITS).map(k=>{const P2=PERMITS[k];return item(P2.name,P2.desc,b.perm[k]?chip('Held','good'):`<button class="btn sm primary" data-a="permit" data-k="${k}" ${S.cash<P2.cost?'disabled':''}>${fmt(P2.cost)}</button>`)}).join('')+'</div>';
  h+=label('Financing')+`<div class="group">`;
  h+=S.loans.map(l=>item(l.name,l.pct?`${Math.round(l.pct*100)}% of weekly profit · ${l.n} weeks left`:`${fmt(l.bal)} left · ${(l.rate*100).toFixed(2)}% interest a week`,l.pct?'':`<button class="btn sm" data-a="repay" data-id="${l.id}" ${S.cash<l.bal?'disabled':''}>Repay</button>`)).join('');
  h+=Object.keys(LOANS).filter(k=>!S.loans.some(l=>l.key===k)).map(k=>{const L2=LOANS[k],lk=L2.bv&&b.form!=='bv'?'Needs a BV':value(S)<(L2.minValue||L2.amt*.9)?`Needs a company worth ${fmt(L2.minValue||L2.amt*.9)}`:'';return item(L2.name,L2.desc||`${fmt(L2.amt)} over ${L2.n} weeks · ${(L2.rate*100).toFixed(2)}% a week${lk?` · <span class="f">${lk}</span>`:''}`,`<button class="btn sm primary" data-a="loan" data-k="${k}" ${lk?'disabled':''}>${fmt(L2.amt)}</button>`)}).join('');
  h+='</div>';
  return h;
}
function vEmpire(){
  let h=segs('empire',[['stores','Stores'],['upgrades','Upgrades'],['media','Media'],['company','Company'],['goals','Goals',sub.empire!=='goals'?Math.min(S.unread,99):0],['more','More']]);
  if(sub.empire==='stores'){
    const closed=Object.keys(STORES).filter(k=>!S.stores[k]),opened=Object.keys(STORES).filter(k=>S.stores[k]);
    if(opened.length){h+=label('Your stores',`rent ${fmt(rent()-space().rent)}/week`)+`<div class="stack">`;
      for(const k of opened){const D=STORES[k],st=S.stores[k],clerks=S.staff.filter(s=>s.role==='clerk'&&s.store===k).length,cap=D.capB*st.level,openToday=clerks>0||S.shift[k]===S.day;
        h+=`<div class="card"><div style="display:flex;gap:10px;align-items:flex-start"><div class="grow"><div class="t">${D.name}</div><div class="s">${openToday?'<span class="good">Open today</span>':'<span class="bad">Closed: no clerk</span>'} · yesterday ${fmt(st.last||0)}</div></div><span class="chip ${st.merged?'amber':''}">${st.merged?'Merged':'Level '+st.level}</span></div>
        <div style="margin-top:12px">${bar(st.stock/cap*100,'var(--amber)')}<div class="kv"><span>Stock <b>${st.stock}/${cap}</b> ${D.item}</span><span>Clerks <b>${clerks}/${st.level*2}</b></span>${D.spoil?'<span>Spoils overnight</span>':''}</div></div>
        <div class="opts"><button class="btn sm primary" data-a="restock" data-k="${k}">Restock ${fmt(Math.min(D.pack,cap-st.stock)*D.unit)} ${en(E.restock())}</button>
        ${clerks?'':`<button class="btn sm uv" data-a="shift" data-k="${k}" ${S.shift[k]===S.day?'disabled':''}>Work a shift ${en(E.shift())}</button>`}
        <button class="btn sm" data-a="clerk" data-k="${k}">+ Clerk €85/day</button>
        ${st.level<3?`<button class="btn sm ghost" data-a="storeUp" data-k="${k}">Level up ${fmt(D.cost*(st.level===1?.4:.8))}</button>`:''}
        ${st.merged?(k==='tcg'?`<button class="btn sm uv" data-a="tournament" ${S.cds.tourn?'disabled':''}>${S.cds.tourn?`Tournament in ${S.cds.tourn} d`:'Host tournament'} ${en(20)}</button>`:k==='cafe'?`<button class="btn sm uv" data-a="workshop" ${S.cds.work?'disabled':''}>${S.cds.work?`Workshop in ${S.cds.work} d`:'Paint workshop'} ${en(20)}</button>`:''):`<button class="btn sm ghost" data-a="merge" data-k="${k}" ${st.level<2?'disabled':''}>${st.level<2?'Merge at level 2':'Merge '+fmt(D.merge)}</button>`}</div>
        ${st.merged?'':`<div class="s" style="margin-top:10px">Merge bonus: ${D.mergeText}</div>`}</div>`}
      h+='</div>'}
    if(closed.length){h+=label('Open a store','sells on days a clerk or you work')+`<div class="group">`;
      for(const k of closed){const D=STORES[k],ok=D.req();h+=item(D.name,ok?`Sells ${D.item} · ${fmt(D.rent)}/week`:`<span class="f">${D.reqText}</span>`,`<button class="btn sm primary" data-a="openStore" data-k="${k}" ${!ok||S.cash<D.cost?'disabled':''}>${fmt(D.cost)}</button>`)}
      h+='</div>'}
  }else if(sub.empire==='upgrades'){
    const UC=UCATS.find(c=>c[0]===sub.up)||UCATS[0],own=UPGRADES.filter(u=>u.cat===UC[0]&&S.up[u.id]).length,tot=UPGRADES.filter(u=>u.cat===UC[0]).length;
    h+=segs('up',UCATS)+label(UC[1],UC[0]==='energy'?`max ${maxE()} · regen ${regen().toFixed(1)}/h`:`${own} of ${tot} owned`)+`<div class="group">${upgradeItems(UC[0])}</div>`;
  }else if(sub.empire==='media'){
    h+=label('Sales channels','where customers find you')+`<div class="group">`;
    for(const k in CHANNELS){const C=CHANNELS[k],on=S.ch[k];h+=item(C.name,k==='web'?'Your own Shopify store':`${C.note}`,on?chip('Live','good'):`<button class="btn sm primary" data-a="channel" data-k="${k}" ${S.cash<C.cost||(C.kvk&&!S.biz.kvk)?'disabled':''}>${C.cost?fmt(C.cost):'Start'}</button>`)}
    h+='</div>'+label('Hype','drops 6% a day')+`<div class="card"><div style="display:flex;align-items:baseline;gap:10px"><span class="num" style="font-size:28px;color:var(--uv)">${Math.round(S.hype)}</span><span class="s">+50 hype doubles webshop demand</span></div><div style="margin-top:10px">${bar(S.hype/2,'var(--uv)')}</div></div>`;
    h+=saleCard()+socialView()+label('Campaigns')+`<div class="group">`;
    for(const C of CAMPAIGNS){const cd=S.cds[C.id]||0,lock=(C.minRating&&S.rating<C.minRating)||(C.minSold&&S.sold<C.minSold)||(C.minHype&&S.hype<C.minHype)||(C.kvk&&!S.biz.kvk)||(C.needCh&&!S.ch[C.needCh]);h+=item(`${C.name} <span class="chip uv">+${C.hype}</span>`,C.desc,`<button class="btn sm ${C.cost?'primary':'uv'}" data-a="camp" data-k="${C.id}" ${cd||lock||S.cash<C.cost?'disabled':''}>${cd?`in ${cd} d`:C.cost?fmt(C.cost):`Post ${en(C.energy)}`}</button>`)}
    h+='</div>';
  }else if(sub.empire==='more'){
    h+=moreView();
  }else if(sub.empire==='company'){
    h+=companyView();
  }else{
    h+=label('Company',`worth ${fmt(value(S))}`)+`<div class="card"><div class="kv" style="margin:0"><span>Sold <b>${S.sold}</b></span><span>Revenue <b>${fmt(S.revenue)}</b></span><span>Reviews <b>${S.reviews}</b></span><span>Rent <b>${fmt(rent())}</b>/wk</span></div>${spark(S.hist)}<div class="s">Cash, last ${S.hist.length} days</div></div>`;
    h+=chartView()+reviewsView()+label('Goals',`${Object.keys(S.done).length} of ${MILESTONES.length}`)+`<div class="group">`+MILESTONES.map(m=>`<div class="item ms ${S.done[m.id]?'done':''}"><i>${S.done[m.id]?'✓':''}</i><div class="grow t">${m.t}</div></div>`).join('')+`</div>`;
    h+=label('Log')+`<div class="group">`+S.log.slice(0,40).map(l=>`<div class="item" style="min-height:0;padding:11px 16px"><span class="logd">D${l.d}</span><div class="grow s ${l.k}" style="margin:0;color:${l.k?'':'var(--ink)'}">${l.t}</div></div>`).join('')+`</div>
    <div style="margin-top:22px;text-align:center"><button class="btn sm ghost" data-a="reset">Start a new company</button></div>`;
  }
  return h;
}
const VIEWS={studio:vStudio,orders:vOrders,buy:vBuy,team:vTeam,empire:vEmpire};
function render(){
  setT(document.getElementById('cash'),fmt(S.cash));document.getElementById('cash').classList.toggle('neg',S.cash<0);
  setT(document.getElementById('clock'),String(S.hour).padStart(2,'0')+':'+String(Math.floor(S.m)).padStart(2,'0')+(S.paused?' · paused':''));
  setT(document.getElementById('day'),`Day ${S.day}`);
  const pd=7-((S.day-1)%7);setH(document.getElementById('mPay'),`Payday <b>${pd===1?'tonight':'in '+pd+' d'}</b>`);
  const w=document.getElementById('waitBtn'),c2=skipCost(2);setH(w,`+2 h<small>${fmt(c2)}</small>`);w.disabled=S.cash<c2;
  const pb=document.getElementById('pauseBtn');setH(pb,S.paused?PLAY:PAUSE);pb.classList.toggle('on',!!S.paused);
  document.getElementById('drinkBtn').disabled=S.drinks>=2;
  setT(document.getElementById('mEnergy'),`${Math.round(S.energy)}/${maxE()}`);
  const eb=document.getElementById('mEnergyBar');eb.style.width=clamp(S.energy/maxE()*100,0,100)+'%';eb.style.background=S.energy<20?'var(--bad)':S.energy<50?'var(--warn)':'var(--good)';
  setT(document.getElementById('mRating'),S.rating.toFixed(2)+'★');
  setT(document.getElementById('mHype'),String(Math.round(S.hype)));renderLv();
  if(tab==='empire'&&sub.empire==='goals')S.unread=0;
  const badge={orders:S.dms.length,empire:S.unread};
  document.querySelectorAll('#tabs button').forEach(b=>{b.classList.toggle('on',b.dataset.tab===tab);let d=b.querySelector('.dot');const n=badge[b.dataset.tab]||0;if(n){if(!d){b.insertAdjacentHTML('beforeend','<span class="dot"></span>');d=b.querySelector('.dot')}d.textContent=n>9?'9+':n}else if(d)d.remove()});
  liveVals={};
  const raw=VIEWS[tab](),main=document.getElementById('main');
  if(raw!==lastHTML){main.innerHTML=raw.replace(/\u0001(\w+)\u0002/g,(m,id)=>liveVals[id]);lastHTML=raw}
  else for(const id in liveVals){const v=liveVals[id];const e1=main.querySelector('[data-l="'+id+'"]');if(e1&&e1.textContent!==v)e1.textContent=v;const e2=main.querySelector('[data-w="'+id+'"]');if(e2)e2.style.width=v+'%'}
}

document.addEventListener('click',e=>{
  const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();window.scrollTo({top:0});return}
  const ch=e.target.closest('[data-choice]');if(ch){if(ch.disabled)return;const o=pending[+ch.dataset.choice];pending=[];closeModal();o&&o.f&&o.f();save();render();nextQueued();return}
  const b=e.target.closest('[data-a]');if(!b||b.disabled)return;
  if(modalOpen())return;
  A[b.dataset.a]({...b.dataset});
  if(b.dataset.a!=='endDay'&&b.dataset.a!=='wait'){if(b.dataset.a!=='togglePr'&&b.dataset.a!=='sub')save();render()}
  if(b.dataset.a==='sub')window.scrollTo({top:0});
});
document.addEventListener('change',e=>{
  const ck=e.target.closest('[data-chk]');if(ck){const p=S.printers.find(x=>x.id==ck.dataset.id);if(p){p[ck.dataset.chk]=ck.checked;save();render()}return}
  const sh=e.target.closest('[data-ship]');if(sh){S.ship[sh.dataset.ship]=sh.value;save();render();return}
  const s=e.target.closest('[data-sel]');if(!s)return;const p=S.printers.find(x=>x.id==s.dataset.id);if(!p||p.state==='printing')return;
  if(s.dataset.sel==='prod')p.prod=s.value;
  else if(s.value!==p.resin){if(!PRINTERS[p.type].form&&p.vat>0){S.resin[p.resin]=(S.resin[p.resin]||0)+p.vat;p.vat=0;toast('Vat drained back into its bottle')}p.resin=s.value}
  save();render();
});

function start(data){
  S=(data&&data.S&&data.S.v===2&&patch(data.S))||load()||fresh();
  if(!S.offers.length&&!S.contracts.length)refreshOffers();
  if(S.started&&!S.trend)newTrend();
  if(data&&data.tab)tab=data.tab;
  render();
  if(S.over)gameOver();else if(!S.started)intro();
  initCloud().finally(()=>setTimeout(maybePatchNotes,350));
  setInterval(liveTick,250);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&S&&S.started&&!modalOpen()){S.lastT=Date.now();save()}});
}
window.claude?.hot?.snapshot?.(()=>({S,tab}));
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
</script>
