<style>
/* Layout: one narrow column, sticky bar with four tabs, every add/edit happens in a bottom sheet so lists never lose typed input. */
:root{
  --bg:#07061a;
  --surface:rgba(24,20,62,.62);
  --sheet:#0e0b2a;
  --ink:#ece9ff;
  --muted:#9c99c6;
  --line:rgba(165,150,255,.2);
  --accent:#a58bff;        /* UV violet, glows against deep space */
  --accent-ink:#0b0720;
  --accent-soft:rgba(140,110,255,.2);
  --bar-past:#4a3f9c;
  --good:#5ee0a6; --good-soft:rgba(60,200,140,.16);
  --warn:#ffc15e; --warn-soft:rgba(255,190,80,.15);
  --bad:#ff7d8f;  --bad-soft:rgba(255,90,110,.16);
  --font-display:'Bricolage Grotesque',system-ui,sans-serif;
  --font-body:'Instrument Sans',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{background:var(--bg);margin:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
/* cosmic backdrop: nebula glow behind a drifting star canvas */
body::before{content:"";position:fixed;inset:0;z-index:-2;pointer-events:none;
  background:radial-gradient(62% 42% at 12% 0%,rgba(112,72,255,.30),transparent 70%),radial-gradient(52% 42% at 100% 32%,rgba(30,160,255,.16),transparent 72%),radial-gradient(64% 52% at 50% 112%,rgba(255,70,170,.15),transparent 70%)}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:40;pointer-events:none}
body{margin:0;min-height:100vh}
body{background:none;color:var(--ink);font:15px/1.45 var(--font-body);padding-inline:16px;padding-block:0 72px}
.app{max-width:760px;margin:0 auto}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono,.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums}

/* sticky bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:rgba(7,6,26,.78);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);margin-inline:-16px;padding:12px 16px 0;border-bottom:1px solid var(--line)}
.bar-in{max-width:760px;margin:0 auto}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-size:22px;font-weight:700}
.brand .tag{font:500 11px var(--font-mono);color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.tabs{display:flex;gap:4px;margin-top:8px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:10px 10px;color:var(--muted);font-weight:600;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

main{display:flex;flex-direction:column;gap:20px;padding-block:20px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-head h2{font-size:18px}
.card{background:var(--surface);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 0 18px rgba(165,139,255,.35)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 12px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.pill{display:inline-block;font:500 11px var(--font-mono);letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}

/* overview */
.hero{display:flex;flex-direction:column;gap:14px}
.hero-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.eyebrow{font:500 11px var(--font-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{font:700 clamp(34px,9vw,48px)/1.05 var(--font-display);letter-spacing:-.02em;margin-top:4px}
.big.neg{color:var(--bad)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.stat{border-top:1px solid var(--line);padding-top:10px;min-width:0}
.stat .v{font:500 18px var(--font-mono);font-variant-numeric:tabular-nums;margin-top:2px;overflow-wrap:anywhere}
.chart{width:100%;height:auto;display:block}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:420px}
th{font:500 11px var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th.r,td.r{text-align:right}
tr:last-child td{border-bottom:0}

/* lists */
.list{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:center}
.row:last-child{border-bottom:0}
.row .name{font-weight:600;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row .sub{font:400 12px var(--font-mono);color:var(--muted);margin-top:2px}
.row .nums{display:flex;gap:6px 16px;flex-wrap:wrap;font:400 13px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted);grid-column:1 / -1}
.row .nums b{color:var(--ink);font-weight:500}
.row .acts{display:flex;gap:8px;grid-column:1 / -1}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg)}
.stepper button{border:0;background:none;width:38px;height:38px;font-size:18px}
.stepper button:hover{background:var(--accent-soft)}
.stepper output{min-width:40px;text-align:center;font:500 16px var(--font-mono);font-variant-numeric:tabular-nums}
.right{text-align:right}
.spark{width:100%;height:auto;display:block}

/* banners */
.note{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13px}
.note.info{background:var(--accent-soft);color:var(--accent)}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start}
.empty h2{font-size:22px}
.empty ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px}

/* sheet */
#sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center;background:rgba(8,8,18,.55)}
#sheet[hidden]{display:none}
.sheet-body{width:100%;max-width:560px;max-height:92%;overflow:auto;background:var(--sheet);border:1px solid var(--line);border-bottom:0;color:var(--ink);border-radius:14px 14px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.sheet-body h3{font-size:19px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field.wide{grid-column:1 / -1}
.field label{font-size:13px;font-weight:600}
.field .unit{font:400 11px var(--font-mono);color:var(--muted)}
.field input,.field select,.field textarea{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.live{font:400 13px var(--font-mono);color:var(--muted);min-height:1.4em;margin:0}
.err{color:var(--bad);font-size:13px;margin:0}
.sheet-acts{display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.sheet-acts .grp{display:flex;gap:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:45;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
#toast[hidden]{display:none}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--ink);text-align:left}
.logo svg{width:30px;height:30px;flex:none}
.logo img{height:34px;max-width:170px;object-fit:contain;display:block}
.logo .word{font:700 23px/1 var(--font-display);letter-spacing:-.02em}
.logo .word i{font-style:normal;color:var(--accent)}
.logo .mark{width:36px;height:36px;border-radius:9px;object-fit:cover;flex:none;display:block}
.hook{display:flex;gap:8px;flex-wrap:wrap}
.field textarea{resize:vertical;font:inherit}
.swatches{display:flex;gap:12px;flex-wrap:wrap;padding:4px 2px}
.sw{width:34px;height:34px;border-radius:50%;border:2px solid transparent;background:var(--c);box-shadow:0 0 12px var(--c);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px var(--sheet),0 0 18px var(--c)}
.swname{font:400 12px var(--font-mono);color:var(--muted)}
.drop{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,rgba(139,92,246,.30),rgba(58,168,255,.14) 60%,rgba(255,79,163,.16)),var(--surface)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
a.btn{display:inline-block;text-decoration:none;color:inherit}
a.btn.primary{color:var(--accent-ink)}
.gprice{font:500 17px var(--font-mono);font-variant-numeric:tabular-nums;text-align:right}
.gprice small{display:block;font:400 11px var(--font-mono);color:var(--muted)}
body.locked .app,body.locked #sheet,body.locked #toast{display:none!important}
#gate{display:none}
body.locked #gate{display:flex}
#gate{position:fixed;inset:0;z-index:30;align-items:center;justify-content:center;padding:20px;overflow:auto}
.gate-card{width:100%;max-width:380px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;text-align:center;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);margin:auto}
.gate-card h2{margin:0;font-size:26px;letter-spacing:-.01em}
.gate-card h2 i{font-style:normal;color:var(--accent)}
.gate-card p{margin:0}
.gate-card form{display:flex;flex-direction:column;gap:12px}
.gate-card input[type=password],.gate-card input[type=text]{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:13px 12px;width:100%;min-width:0;text-align:center;font-size:18px;letter-spacing:.06em;color:inherit}
.gate-card input:focus{border-color:var(--accent);outline:0}
.gate-mark{width:64px;height:64px;border-radius:16px;margin:0 auto;object-fit:cover}
.gate-keep{display:flex;gap:8px;align-items:center;justify-content:center;font-size:13px;color:var(--muted)}
.gate-link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:4px;cursor:pointer}
.gate-big{font-size:30px;line-height:1.15;font-weight:700;letter-spacing:-.02em;margin:4px 0}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.prof{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:12px;color:inherit;cursor:pointer}
.prof:hover{border-color:var(--accent)}
.prof .nm{font-weight:600}
.av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--accent-soft);color:var(--accent);flex:none}
.gate-card.wide{max-width:460px;text-align:left}
.gate-card.wide h2,.gate-card.wide .gate-mark,.gate-card.wide>p{text-align:center}
.gate-card.wide h3{margin:10px 0 0;font-size:15px}
.gate-card .stats{text-align:left}
.pbar{display:flex;align-items:center;justify-content:space-between;gap:10px;text-align:left}
.pbar .cur{font:500 12px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.pmenu{display:flex;flex-direction:column;gap:2px;text-align:left;border:1px solid var(--line);border-radius:14px;padding:6px;background:var(--bg)}
.pmenu button{display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:none;color:inherit;padding:12px;border-radius:10px;font-size:15px;cursor:pointer;font-family:inherit}
.pmenu button.on{background:var(--accent-soft);color:var(--accent)}
.pmenu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.job{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.job.done{opacity:.62}
.job h4{margin:0;font-size:15px;min-width:0;overflow-wrap:anywhere}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;color:inherit;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);text-align:left;font-size:15px}
.cbtn span{min-width:0;overflow-wrap:anywhere}
.pbox{border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.pbox .ptime{font:500 30px var(--font-mono);font-variant-numeric:tabular-nums}
.gate-card .pbox input,.gate-card .pbox select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:11px 12px;width:100%;min-width:0;color:inherit;font:400 16px var(--font-sans,inherit);text-align:left;letter-spacing:0}
.pbox .r2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.lnk{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:13px;padding:2px 4px;cursor:pointer}
.paidtile{grid-column:1/-1;border:1px solid var(--line);border-radius:12px;padding:12px;transition:box-shadow .3s}
.paidtile.payglow{box-shadow:0 0 0 1px rgba(255,200,90,.7),0 0 30px rgba(255,185,60,.4)}
#g-paid-v{display:inline-block;transition:transform .12s;transform-origin:left center;font-size:26px}
.gal{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gal figure{margin:0;display:flex;flex-direction:column;gap:8px}
.gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--bg)}
.searchrow{display:flex;gap:8px}
.searchrow input,.searchrow select{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px;min-width:0}
.searchrow input{flex:1 1 auto}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.kv span:last-child{font-family:var(--font-mono);text-align:right}
.kv.total{font-weight:700;border-bottom:0}
.big2{font:700 34px var(--font-display,inherit);letter-spacing:-.02em}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.seg.tight button{padding:7px 9px}
.brandr{display:flex;align-items:center;gap:10px}
@media (max-width:480px){.brand .tag{display:none}}
/* black hole theme: pure black, warm accretion-disk accent */
:root[data-theme="blackhole"]{--bg:#000;--surface:rgba(10,10,12,.74);--sheet:#050506;--ink:#ecebf0;--muted:#8d8c99;--line:rgba(255,255,255,.11);--accent:#ffa24d;--accent-ink:#120700;--accent-soft:rgba(255,150,60,.16);--bar-past:#6b4524}
:root[data-theme="blackhole"] body::before{background:radial-gradient(42% 30% at 74% 18%,rgba(255,140,40,.16),transparent 70%)}
:root[data-theme="blackhole"] .bar{background:rgba(0,0,0,.8)}
:root[data-theme="blackhole"] .btn.primary{box-shadow:0 0 18px rgba(255,150,60,.3)}
:root[data-theme="blackhole"] .big{text-shadow:0 0 30px rgba(255,150,60,.35)}
:root[data-theme="vortex"]{--bg:#010a05;--surface:rgba(6,26,16,.66);--sheet:#04140b;--ink:#e6fff1;--muted:#86b8a0;--line:rgba(110,255,170,.2);--accent:#4dffa0;--accent-ink:#00180b;--accent-soft:rgba(60,255,150,.16);--bar-past:#1f7a4d}
:root[data-theme="vortex"] body::before{background:radial-gradient(46% 32% at 74% 18%,rgba(40,255,140,.2),transparent 70%)}
:root[data-theme="vortex"] .bar{background:rgba(1,10,5,.82)}
:root[data-theme="vortex"] .btn.primary{box-shadow:0 0 18px rgba(60,255,150,.34)}
:root[data-theme="vortex"] .big{text-shadow:0 0 30px rgba(60,255,150,.4)}
.jchat{display:flex;flex-direction:column;gap:8px;text-align:left;border-top:1px solid var(--line);padding-top:8px}
.nb{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px 10px;font-size:14px;overflow-wrap:anywhere}.nb.mine{border-color:var(--accent)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}.thumbs .th{position:relative}.jimg{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:pointer;background:var(--bg)}.jimg.big{width:100%;height:auto;max-height:70vh;object-fit:contain}
.thumbs .th:has(.big){flex:1 0 100%}.thumbs .x{position:absolute;top:2px;right:2px;border:0;border-radius:50%;width:22px;height:22px;background:rgba(0,0,0,.65);color:#fff;font-size:12px;cursor:pointer}
.stp{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;color:inherit;padding:7px 0;font:inherit;cursor:pointer;min-height:36px}.stp.d span{text-decoration:line-through;opacity:.6}.stp b{font-size:18px;line-height:1.2}.stpl{display:flex;flex-direction:column;border-top:1px solid var(--line);margin-top:6px}
.fixb{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 10px;font-size:14px;text-align:left;overflow-wrap:anywhere}
.gbar{height:10px;border-radius:99px;background:var(--bg);border:1px solid var(--line);overflow:hidden}.gbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good))}
.big{text-shadow:0 0 30px rgba(165,139,255,.45)}
.hook input{flex:1 1 220px;min-width:0;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 10px}
.hook input:focus{border-color:var(--accent)}
.thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--accent-soft);flex:none;display:block}
.thumb.ph{display:grid;place-items:center;border:1px dashed var(--line);background:var(--bg)}
.rowhead{display:flex;gap:12px;align-items:center;min-width:0}
.pill.plain{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.field input[type=file]{padding:7px 8px}
.field.check{flex-direction:row-reverse;justify-content:flex-end;align-items:center;gap:8px}
.field.check input{width:auto}
.preview{max-width:100%;max-height:160px;border-radius:8px;object-fit:contain;align-self:flex-start;background:var(--bg)}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.btn,.tab{transition:border-color .15s,background .15s,color .15s}}
</style>
</head>
<body class="locked">

/* ---------- storage: data in localStorage, photos in IndexedDB ---------- */
var LS='resinaprint-data-v1';
function lsLoad(){
  try{
    var j=JSON.parse(localStorage.getItem(LS)||'null');
    if(j){COLL.forEach(function(c){S[c]=Array.isArray(j[c])?j[c]:[]});SET=Object.assign({logoId:''},j.settings||{})}
  }catch(e){}
}
function lsSave(){
  try{localStorage.setItem(LS,JSON.stringify({products:S.products,purchases:S.purchases,sales:S.sales,fails:S.fails,costs:S.costs,orders:S.orders,queue:S.queue,supplies:S.supplies,reminders:S.reminders,settings:SET}));if(SYNC.on)syncSoon();return true}
  catch(e){toast('Could not save. Browser storage may be full or blocked.');return false}
}
async function put(coll,obj){
  var i=S[coll].findIndex(function(x){return x.id===obj.id});
  if(i<0)S[coll].push(obj);else S[coll][i]=obj;
  lsSave();render();
}
async function del(coll,id){S[coll]=S[coll].filter(function(x){return x.id!==id});lsSave();render()}

var IDBP=null,urlCache={},pendingImport=null;
function idb(){
  return IDBP||(IDBP=new Promise(function(res,rej){
    var r=indexedDB.open('resinaprint',1);
    r.onupgradeneeded=function(){r.result.createObjectStore('images')};
    r.onsuccess=function(){res(r.result)};
    r.onerror=function(){rej(r.error)};
  }));
}
function idbOp(mode,fn){
  return idb().then(function(d){return new Promise(function(res,rej){
    var tx=d.transaction('images',mode),rq=fn(tx.objectStore('images'));
    tx.oncomplete=function(){res(rq&&rq.result)};
    tx.onerror=tx.onabort=function(){rej(tx.error)};
  })});
}
async function imgPut(blob){var id=uid()+uid();await idbOp('readwrite',function(s){return s.put(blob,id)});return id}
function imgGet(id){return idbOp('readonly',function(s){return s.get(id)})}
async function imgDel(id){
  if(!id)return;
  try{await idbOp('readwrite',function(s){return s.delete(id)})}catch(e){}
  if(urlCache[id]){try{URL.revokeObjectURL(urlCache[id])}catch(e){}delete urlCache[id]}
}
async function imgUrl(id){
  if(urlCache[id])return urlCache[id];
  var b=await imgGet(id);if(!b)return '';
  return (urlCache[id]=URL.createObjectURL(b));
}
function hydrate(){
  document.querySelectorAll('img[data-img]').forEach(function(el){
    if(el.getAttribute('src'))return;
    imgUrl(el.getAttribute('data-img')).then(function(u){if(u&&!el.getAttribute('src'))el.src=u},function(){});
  });
}

/* ---------- logo and photos ---------- */
var LAYERS='<rect x="11" y="5" width="10" height="6" rx="2" style="fill:var(--accent);opacity:.45"/><rect x="7" y="13" width="18" height="6" rx="2" style="fill:var(--accent);opacity:.7"/><rect x="3" y="21" width="26" height="6" rx="2" style="fill:var(--accent)"/>';
var logoKey=null;
function renderLogo(){
  var el=$('#logo');if(!el)return;
  var k=SET.logoId||'';if(logoKey===k)return;logoKey=k;
  el.innerHTML=k?'<img alt="Resinaprint" data-img="'+esc(k)+'"'+(urlCache[k]?' src="'+urlCache[k]+'"':'')+'>':'<img class="mark" src="logo.jpg" alt=""><span class="word">resin<i>a</i>print</span>';
  hydrate();
}
function thumb(p){
  return p.imageId?'<img class="thumb" alt="" data-img="'+esc(p.imageId)+'"'+(urlCache[p.imageId]?' src="'+urlCache[p.imageId]+'"':'')+'>':'<div class="thumb ph" aria-hidden="true"><svg viewBox="0 0 32 32" width="26" height="26">'+LAYERS+'</svg></div>';
}
function shrink(file,max,type){
  return new Promise(function(res,rej){
    var url=URL.createObjectURL(file),img=new Image();
    img.onload=function(){
      var k=Math.min(1,max/Math.max(img.width,img.height)),w=Math.max(1,Math.round(img.width*k)),h=Math.max(1,Math.round(img.height*k)),c=document.createElement('canvas');
      c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
      c.toBlob(function(b){b?res(b):rej({code:'encode'})},type,0.85);
    };
    img.onerror=function(){URL.revokeObjectURL(url);rej({code:'read'})};
    img.src=url;
  });
}
async function uploadImage(file,max,type){var b=await shrink(file,max,type||'image/jpeg');return imgPut(b)}
async function dropAsset(id){return imgDel(id)}
function imageFields(p){
  var f=[{key:'image',label:'Photo',type:'file',wide:true,current:p.imageId||''}];
  if(p.imageId)f.push({key:'removeImage',label:'Remove photo',type:'check',wide:true});
  return f;
}
function brandSheet(){
  openSheet({title:'Logo',cta:'Save logo',values:{},
    fields:[{key:'logo',label:'Logo image',type:'file',wide:true,current:SET.logoId||''}].concat(SET.logoId?[{key:'removeLogo',label:'Go back to the text logo',type:'check',wide:true}]:[]),
    onSave:async function(v){
      var old=SET.logoId,id=old;
      if(v.removeLogo)id='';
      if(v.logo){try{id=await uploadImage(v.logo,600,'image/png')}catch(x){return 'Could not read that image. Try a PNG or JPG.'}}
      if(id===old)return;
      SET.logoId=id;lsSave();logoKey=null;render();
      if(old&&old!==id)await imgDel(old);
    }});
}

/* ---------- backup ---------- */
function blobToData(b){return new Promise(function(res,rej){var r=new FileReader();r.onload=function(){res(r.result)};r.onerror=rej;r.readAsDataURL(b)})}
function dataToBlob(u){return fetch(u).then(function(r){return r.blob()})}
async function exportData(){
  try{
    var ids=[];S.products.forEach(function(p){if(p.imageId)ids.push(p.imageId);(p.gallery||[]).forEach(function(g){ids.push(g)})});if(SET.logoId)ids.push(SET.logoId);
    var images={};
    for(var i=0;i<ids.length;i++){var b=await imgGet(ids[i]);if(b)images[ids[i]]=await blobToData(b)}
    var team=null;if(CLOUD&&TOKEN){try{team=await api('/api/export')}catch(e){team=null}}
    var json=JSON.stringify({app:'resinaprint',version:1,exported:new Date().toISOString(),cloudTeam:team,products:S.products,purchases:S.purchases,sales:S.sales,fails:S.fails,costs:S.costs,orders:S.orders,queue:S.queue,supplies:S.supplies,reminders:S.reminders,settings:SET,access:ACC,images:images});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));
    a.download='resinaprint-backup-'+today()+'.json';
    document.body.appendChild(a);a.click();
    setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);
    try{localStorage.setItem('rl-lastbackup',today())}catch(e){}
    render();toast('Backup downloaded.');
  }catch(e){toast('Could not make the backup.')}
}
async function applyImport(){
  var d=pendingImport;pendingImport=null;
  try{
    var ids=Object.keys(d.images||{});
    for(var i=0;i<ids.length;i++){var b=await dataToBlob(d.images[ids[i]]);await idbOp('readwrite',function(st){return st.put(b,ids[i])})}
    function clean(a){return (Array.isArray(a)?a:[]).filter(function(x){return x&&typeof x.id==='string'})}
    COLL.forEach(function(c){S[c]=clean(d[c])});
    SET=Object.assign({logoId:''},d.settings||{});
    if(d.access&&d.access.owner){ACC={owner:d.access.owner,workers:Array.isArray(d.access.workers)?d.access.workers:[]};accSave()}
    lsSave();logoKey=null;render();toast('Backup restored.');
  }catch(e){toast('Could not restore that file.');render()}
}
/* ---------- discord ---------- */
var HOOK_RE=/^https:\/\/(?:ptb\.|canary\.)?discord(?:app)?\.com\/api\/webhooks\/\d+\/[\w-]+$/;
function getHook(){try{return localStorage.getItem('rl-webhook')||''}catch(e){return ''}}
function setHook(u){try{if(u)localStorage.setItem('rl-webhook',u);else localStorage.removeItem('rl-webhook');return true}catch(e){return false}}
function needHook(){
  if(getHook())return true;
  toast('Add your Discord webhook first.');ui.tab='discord';ui.gallery=null;render();window.scrollTo(0,0);return false;
}
async function sendDiscord(payload,files){
  var url=getHook();if(!url){needHook();return false}
  payload.username='Resinaprint';
  if(!payload.allowed_mentions)payload.allowed_mentions={parse:[]};
  files=files||[];
  try{
    var r;
    if(files.length){
      payload.attachments=files.map(function(f,i){return {id:i,filename:f.name}});
      var fd=new FormData();fd.append('payload_json',JSON.stringify(payload));
      files.forEach(function(f,i){fd.append('files['+i+']',f.blob,f.name)});
      r=await fetch(url,{method:'POST',body:fd});
    }else{
      r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
    }
    if(r.ok){toast('Sent to Discord.');return true}
    toast(r.status===404||r.status===401?'Discord rejected the webhook. It may have been deleted. Add a new one on the Discord tab.':r.status===413?'The images are too big for Discord.':'Discord could not take it (error '+r.status+').');
  }catch(e){toast('Could not reach Discord. Check your connection.')}
  return false;
}

/* every message goes out as a cosmic card with a generated nebula banner above it */
function cosmicBannerOn(){try{return localStorage.getItem('rl-banner')!=='0'}catch(e){return true}}
function hslOf(hex){
  var c=rgbOf(hex),r=c[0]/255,g=c[1]/255,b=c[2]/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2,h=0,sa=0,d=mx-mn;
  if(d){sa=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}
  return [h,sa*100,l*100];
}
async function makeBanner(label,hex){
  hex=safeHex(hex);
  try{if(document.fonts&&document.fonts.load)await document.fonts.load('700 58px "Bricolage Grotesque"')}catch(e){}
  var W=1200,H=300,cv=document.createElement('canvas');cv.width=W;cv.height=H;
  var x=cv.getContext('2d'),h0=hslOf(hex)[0],i;
  function R(a,b){return a+Math.random()*(b-a)}
  var bg=x.createLinearGradient(0,0,W,H);bg.addColorStop(0,'#05040f');bg.addColorStop(1,'hsl('+Math.round(h0)+',55%,8%)');x.fillStyle=bg;x.fillRect(0,0,W,H);
  var shifts=[0,35,-30,70,10];
  for(i=0;i<5;i++){
    var cx=R(0,W),cy=R(-40,H+40),r=R(180,420),hh=Math.round(h0+shifts[i]),g=x.createRadialGradient(cx,cy,0,cx,cy,r);
    g.addColorStop(0,'hsla('+hh+',85%,58%,'+R(.28,.5).toFixed(2)+')');g.addColorStop(1,'hsla('+hh+',85%,40%,0)');x.fillStyle=g;x.fillRect(0,0,W,H);
  }
  for(i=0;i<380;i++){
    var sx=R(0,W),sy=R(0,H),sr=Math.pow(Math.random(),3)*1.6+.35,al=R(.25,1);
    x.fillStyle='rgba(255,255,255,'+al.toFixed(2)+')';x.beginPath();x.arc(sx,sy,sr,0,6.283);x.fill();
    if(sr>1.5){
      var gg=x.createRadialGradient(sx,sy,0,sx,sy,sr*6);gg.addColorStop(0,'rgba(255,255,255,.35)');gg.addColorStop(1,'rgba(255,255,255,0)');
      x.fillStyle=gg;x.fillRect(sx-sr*6,sy-sr*6,sr*12,sr*12);
      x.fillStyle='rgba(255,255,255,.5)';x.fillRect(sx-sr*5,sy-.4,sr*10,.8);x.fillRect(sx-.4,sy-sr*5,.8,sr*10);
    }
  }
  var pcx=W*.8,pcy=H+560,pr=640,rim=x.createRadialGradient(pcx,pcy,pr-8,pcx,pcy,pr+46);
  rim.addColorStop(0,'hsla('+Math.round(h0)+',90%,70%,.95)');rim.addColorStop(.25,'hsla('+Math.round(h0+20)+',90%,55%,.45)');rim.addColorStop(1,'hsla('+Math.round(h0)+',90%,50%,0)');
  x.fillStyle=rim;x.beginPath();x.arc(pcx,pcy,pr+46,0,6.283);x.fill();
  var pl=x.createRadialGradient(pcx-120,pcy-pr+40,10,pcx,pcy,pr);pl.addColorStop(0,'#14102e');pl.addColorStop(1,'#03020a');
  x.fillStyle=pl;x.beginPath();x.arc(pcx,pcy,pr,0,6.283);x.fill();
  var fam='"Bricolage Grotesque",system-ui,sans-serif';
  try{x.letterSpacing='12px'}catch(e){}
  x.font='700 58px '+fam;x.shadowColor=hex;x.shadowBlur=28;x.fillStyle='#ffffff';x.fillText(String(label).toUpperCase(),56,168);
  x.shadowBlur=0;try{x.letterSpacing='9px'}catch(e){}
  x.font='500 22px '+fam;x.fillStyle='rgba(255,255,255,.62)';x.fillText('RESINAPRINT',58,214);
  return new Promise(function(res,rej){cv.toBlob(function(b){b?res(b):rej(new Error('banner'))},'image/jpeg',.86)});
}
async function postCosmic(o){
  if(!needHook())return false;
  toast('Sending…');
  var hex=safeHex(o.hex||'#8b5cf6'),emb=Object.assign({color:parseInt(hex.slice(1),16),timestamp:new Date().toISOString()},o.embed);
  if(!emb.footer)emb.footer={text:'Resinaprint ✦ transmission'};
  var shop=(SET.biz&&SET.biz.shop)||'';if(shop&&!emb.url&&/^https:\/\/\S+$/i.test(shop))emb.url=shop;
  var files=[],embeds=[];
  if(cosmicBannerOn()){
    try{var bn=await makeBanner(o.label||'RESINAPRINT',hex);files.push({blob:bn,name:'cosmos.jpg'});embeds.push({color:emb.color,image:{url:'attachment://cosmos.jpg'}})}catch(e){}
  }
  if(o.photo){files.push({blob:o.photo,name:'figure.jpg'});emb.image={url:'attachment://figure.jpg'}}
  embeds.push(emb);
  var payload={embeds:embeds};
  if(o.ping){payload.content='@everyone';payload.allowed_mentions={parse:['everyone']}}
  return sendDiscord(payload,files);
}

function summaryPayload(){
  var R=resin(),start=periodStart(),T=totalsFrom(start);
  var bought=sum(S.purchases.filter(function(p){return p.date>=start}),function(p){return +p.price||0});
  var label={month:'This month',quarter:'Last 3 months',all:'All time'}[ui.period];
  var low=S.products.filter(function(p){return (+p.qty||0)<=(+p.minStock||0)});
  var f=[{name:'Profit',value:money(T.profit),inline:true},{name:'Revenue',value:money(T.rev),inline:true},{name:'Margin',value:T.rev>0?pct(T.profit/T.rev):'–',inline:true},
    {name:'Cost of goods',value:money(T.cogs),inline:true},{name:'Failed prints',value:money(T.waste),inline:true},{name:'Other costs',value:money(T.opex),inline:true},
    {name:'Resin bought',value:money(bought),inline:true},{name:'Resin price',value:R.avg>0?money(R.avg)+' / L avg':'–',inline:true}];
  if(low.length)f.push({name:'Low stock',value:low.map(function(p){return p.name+': '+(+p.qty||0)+' left'}).join('\n').slice(0,1000),inline:false});
  return {label:'PROFIT REPORT',embed:{author:{name:'🪐 MISSION REPORT'},title:'✦ '+label+' ✦',fields:f,footer:{text:'Resinaprint ✦ profit report'}}};
}
function stockPayload(){
  var P=S.products.slice().sort(function(a,b){return String(a.name).localeCompare(String(b.name))});
  var lines=P.map(function(p){
    var q=+p.qty||0,flag=q===0?'🔴':q<=(+p.minStock||0)?'🟠':'🟢';
    return flag+' '+p.name+(p.finish==='painted'?' (painted)':'')+': **'+q+'**';
  });
  var text=lines.join('\n');if(text.length>3900)text=text.slice(0,3900)+'\n…';
  return {label:'STOCK REPORT',embed:{author:{name:'📦 CARGO BAY'},title:'✦ Stock ✦',description:text||'No figures yet.',footer:{text:sum(P,function(p){return +p.qty||0})+' pieces in stock ✦ Resinaprint'}}};
}
function lowStockPayload(){
  var low=S.products.filter(function(p){return (+p.qty||0)<=(+p.minStock||0)}).sort(function(a,b){return (+a.qty||0)-(+b.qty||0)});
  if(!low.length)return null;
  return {label:'LOW STOCK',hex:'#ffb62e',embed:{author:{name:'⚠️ FUEL WARNING'},title:'✦ Running low ✦',
    description:low.map(function(p){var q=+p.qty||0;return (q===0?'🔴':'🟠')+' '+p.name+(p.finish==='painted'?' (painted)':'')+': **'+q+'** left'}).join('\n').slice(0,3900),
    footer:{text:'Resinaprint ✦ stock watch'}}};
}

function buildDrop(v,p){

function adjustDrop(pid,delta){
  if(!pid)return null;
  var arr=SET.drops||[],d;
  if(delta>0)d=arr.find(function(x){return x.productId===pid&&(+x.sold||0)<(+x.edition||0)});
  else d=arr.find(function(x){return x.productId===pid&&(+x.sold||0)>0});
  if(!d)return null;
  var was=+d.sold||0,ed=+d.edition||0;
  d.sold=Math.max(0,Math.min(ed,was+delta));lsSave();
  return (delta>0&&was<ed&&d.sold>=ed)?d:null;
}
function dropBar(sold,ed){var n=ed>0?Math.round(sold/ed*10):0;return '▰'.repeat(n)+'▱'.repeat(10-n)}

function totalsBy(inR){
  var sales=S.sales.filter(function(x){return inR(x.date)});
  var rev=sum(sales,function(x){return x.qty*x.unitPrice}),cogs=sum(sales,function(x){return x.qty*x.unitCost});

  var equip=sum(S.costs.filter(function(c){return inR(c.date)&&c.cat==='equipment'}),function(c){return +c.amount||0});
  return {rev:rev,cogs:cogs,waste:waste,opex:opex,equip:equip,profit:rev-cogs-waste-opex};
}

/* ---------- resin on hand, supplies ---------- */
function resinState(){
  var R=resin(),pm={},since=daysAgo(30);
  S.products.forEach(function(p){pm[p.id]=+p.resinMl||0});
  function ml(x){return x.qty*(x.ml!=null?+x.ml:(pm[x.productId]||0))}
  var used=sum(S.sales,ml),failed=sum(S.fails,function(f){return +f.ml||0}),bought=R.L*1000;
  var recent=sum(S.sales.filter(function(x){return x.date>=since}),ml)+sum(S.fails.filter(function(f){return f.date>=since}),function(f){return +f.ml||0});
  var computed=bought-used-failed,onHand=computed+(+SET.resinAdj||0),perDay=recent/30;
  return {bought:bought,used:used,failed:failed,computed:computed,onHand:onHand,perDay:perDay,daysLeft:perDay>0?Math.max(0,onHand)/perDay:null,min:SET.resinMin!=null&&SET.resinMin!==''?+SET.resinMin:500};
}
function fmlt(ml){return ml>=1000?String(Math.round(ml/10)/100).replace('.',',')+' L':Math.round(ml)+' ml'}
function vResinLow(){
  if(!S.purchases.length)return '';
  var r=resinState();
  if(r.onHand>=r.min)return '';

/* Shopify CSV */
function parseCsv(text){
  text=String(text).replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'',delim=(first.split(';').length>first.split(',').length)?';':',',rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=ch}
    else if(ch==='"')q=true;
    else if(ch===delim){row.push(cur);cur=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';if(row.length>1||row[0]!=='')rows.push(row);row=[]}
    else cur+=ch;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function shopifyOrders(text){

  var hd=rows[0].map(function(x){return x.trim().toLowerCase()}),ix=function(n){return hd.indexOf(n)};

  if(iN<0||iQ<0||iT<0||iP<0)return {err:'This does not look like a Shopify orders export. It needs the columns Name, Lineitem quantity, Lineitem name and Lineitem price.'};
  var iD=ix('created at'),iS=ix('shipping name'),iB=ix('billing name'),iF=ix('fulfillment status'),iA1=ix('shipping address1'),iZ=ix('shipping zip'),iC=ix('shipping city'),iK=ix('shipping country'),iNote=ix('notes'),iTr=ix('tracking number'),cur=null,out=[];
  function g(r,k){return k>=0&&r[k]!=null?String(r[k]).trim():''}
  rows.slice(1).forEach(function(r){
    var nm=g(r,iN);if(!nm)return;
    if(!cur||cur.name!==nm||g(r,iD)){var d=g(r,iD).slice(0,10);cur={name:nm,date:/^\d{4}-\d{2}-\d{2}$/.test(d)?d:today(),customer:g(r,iS)||g(r,iB),address:[g(r,iA1),[g(r,iZ),g(r,iC)].filter(Boolean).join(' '),g(r,iK)].filter(Boolean).join('\n'),status:/^fulfilled/i.test(g(r,iF))?'shipped':'toship',tracking:g(r,iTr),note:g(r,iNote)}}
    var qty=Math.round(n0(g(r,iQ))),pr=n0(g(r,iP));if(!(qty>=1)||isNaN(pr))return;
    out.push({shop:cur.name,date:cur.date,customer:cur.customer,address:cur.address,status:cur.status,tracking:cur.tracking,note:cur.note,item:g(r,iT),qty:qty,price:pr});
  });

}

  var L=F.filter(function(p){return !q||String(p.name).toLowerCase().indexOf(q)>=0});
  var cmp={name:function(a,b){return String(a.name).localeCompare(String(b.name))},
    low:function(a,b){return (+a.qty||0)-(+b.qty||0)},
    profit:function(a,b){return ((+b.price||0)-costOf(b,R.avg))-((+a.price||0)-costOf(a,R.avg))},
    margin:function(a,b){function m(p){return +p.price>0?(p.price-costOf(p,R.avg))/p.price:0}return m(b)-m(a)}}[ui.sortS]||function(){return 0};

async function api(path,opt){

function slipRows(itemsAsc,paysAsc,payId){
  var before=0,amt=0,found=false;
  paysAsc.forEach(function(q){if(found)return;if(q.id===payId){amt=q.amount_cents;found=true}else before+=q.amount_cents});
  if(!found||amt<=0)return [];
  var a=before,b=before+amt,cum=0,rows=[];
  itemsAsc.forEach(function(x){var c=x.cents!==undefined?x.cents:(x.fixed?0:Math.round(x.hours*x.rate_cents)),c0=cum,c1=cum+c;cum=c1;if(c<=0)return;var ov=Math.min(b,c1)-Math.max(a,c0);if(ov>0)rows.push({date:x.date,note:x.note||'',hours:x.hours*(ov/c),cents:ov})});
  return rows;
}

async function syncPush(){

  Object.keys(snap).forEach(function(k){var h=hstr(snap[k].json);if(SYNC.sent[k]!==h)ch.push({k:k,coll:snap[k].coll,id:snap[k].id,data:snap[k].json,h:h})});
  Object.keys(SYNC.sent).forEach(function(k){if(!snap[k]){var p=k.split('\u0001');ch.push({k:k,coll:p[0],id:p[1],data:null,h:null});dels++}});
  if(dels>20&&dels>Object.keys(SYNC.sent).length*0.5&&!SYNC.force){var g=new Error('guard');g.guard=true;throw g}
  for(var i=0;i<ch.length;i+=100){
    var part=ch.slice(i,i+100);
    await api('/api/sync',{method:'POST',body:{changes:part.map(function(x){return {coll:x.coll,id:x.id,data:x.data}})}});
    part.forEach(function(x){if(x.h===null)delete SYNC.sent[x.k];else SYNC.sent[x.k]=x.h});
  }

async function syncPull(){
  var changed=false,more=true;
  while(more){
    var r=await api('/api/sync?since='+SYNC.cursor);
    r.records.forEach(function(rec){
      var k=rec.coll+'\u0001'+rec.id;
      if(rec.del){if(rec.coll!=='_set'&&S[rec.coll]){var n=S[rec.coll].length;S[rec.coll]=S[rec.coll].filter(function(x){return x.id!==rec.id});if(S[rec.coll].length!==n)changed=true}delete SYNC.sent[k];return}

      if(!S[rec.coll])return;

      if(i<0){arr.push(obj);changed=true}else if(JSON.stringify(arr[i])!==rec.data){arr[i]=obj;changed=true}

function repRange(key){
  var m=/^m:(\d{4})-(\d{2})$/.exec(key),y=/^y:(\d{4})$/.exec(key);
  if(m)return {from:m[1]+'-'+m[2]+'-01',to:m[1]+'-'+m[2]+'-31'};
  if(y)return {from:y[1]+'-01-01',to:y[1]+'-12-31'};
  return null;
}
function repLabel(key){
  var m=/^m:(\d{4})-(\d{2})$/.exec(key);
  if(m)return new Date(+m[1],+m[2]-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  return key.slice(2);
}

function tplParse(txt){
  var steps=[],bad='';
  String(txt||'').split(/\r?\n/).forEach(function(line,i){
    line=line.trim();if(!line||bad)return;
    var p=line.split('|').map(function(q){return q.trim()}),title=p[0],bud=null,fx=false;
    if(!title){bad='Line '+(i+1)+' needs a title.';return}
    if(p[1]){bud=n0(p[1]);if(isNaN(bud)||bud<0){bad='Line '+(i+1)+': the amount after | must be a number, like 5 or 12,50.';return}bud=Math.round(bud*100)}
    if(p[2]&&/^fixed$/i.test(p[2]))fx=true;
    if(fx&&!(bud>0)){bad='Line '+(i+1)+': a fixed price needs an amount.';return}
    steps.push({title:title,details:'',budget_cents:bud,pay_mode:fx?'fixed':'hours'});
  });
  return bad?{err:bad}:{steps:steps};
}

function saveBlob(blob,name){
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},2000);

function csvCell(v){var t=String(v==null?'':v);return /[";\r\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t}
function cn(n){return String(Math.round((+n||0)*100)/100).replace('.',',')}
function byDateAsc(a,b){return a.date<b.date?-1:a.date>b.date?1:0}
function csvDownload(kind){
  var head,rows;
  if(kind==='month'){
    var set={};S.sales.concat(S.costs,S.fails).forEach(function(r){if(r.date)set[String(r.date).slice(0,7)]=1});
    head=['Month','Revenue','Cost of goods','Failed prints','Other costs','Equipment','Profit'];
    rows=Object.keys(set).sort().map(function(m){var T=totalsBy(function(d){return String(d).slice(0,7)===m});return [m,cn(T.rev),cn(T.cogs),cn(T.waste),cn(T.opex),cn(T.equip),cn(T.profit)]});
  }else if(kind==='sales'){
    head=['Date','Figure','Quantity','Price each','Cost each','Revenue','Cost','Profit'];
    rows=S.sales.slice().sort(byDateAsc).map(function(x){return [x.date,x.name,x.qty,cn(x.unitPrice),cn(x.unitCost),cn(x.qty*x.unitPrice),cn(x.qty*x.unitCost),cn(x.qty*(x.unitPrice-x.unitCost))]});
  }else if(kind==='purchases'){
    head=['Date','Resin','Litres','Paid','Shop','Price per litre'];
    rows=S.purchases.slice().sort(byDateAsc).map(function(p){return [p.date,p.name,cn(p.liters),cn(p.price),p.supplier||'',cn(+p.liters>0?p.price/p.liters:0)]});
  }else if(kind==='costs'){
    head=['Date','Category','Description','Amount'];
    rows=S.costs.slice().sort(byDateAsc).map(function(c){return [c.date,lab(COST_CATS,c.cat),c.name||'',cn(c.amount)]});
  }else if(kind==='fails'){
    head=['Date','Figure','Resin wasted (ml)','Reason','Resin cost','Note'];
    rows=S.fails.slice().sort(byDateAsc).map(function(f){return [f.date,f.name||'',cn(f.ml),lab(REASONS,f.reason),cn(f.cost),f.note||'']});
  }else{
    head=['Order','Date','Customer','Figure','Quantity','Price each','Total','Status','Tracking','Note'];
    rows=S.orders.slice().sort(byDateAsc).map(function(o){return [o.no,o.date,o.customer||'',o.name,o.qty,cn(o.unitPrice),cn(o.qty*o.unitPrice),lab(ORD,o.status),o.tracking||'',o.note||'']});
  }
  if(!rows.length){toast('Nothing to export yet.');return}
  var text='﻿'+[head].concat(rows).map(function(r){return r.map(csvCell).join(';')}).join('\r\n')+'\r\n';
  saveBlob(new Blob([text],{type:'text/csv;charset=utf-8'}),'resinaprint-'+kind+'-'+today()+'.csv');
  toast('Spreadsheet downloaded.');
}

/* ---------- numbers ---------- */
function resin(){
  var L=0,E=0;
  S.purchases.forEach(function(p){L+=+p.liters||0;E+=+p.price||0});
  var sorted=S.purchases.slice().sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0});
  function perL(p){return +p.liters>0?(+p.price)/(+p.liters):0}
  var last=sorted.length?sorted[sorted.length-1]:null;
  return {L:L,E:E,avg:L>0?E/L:0,last:last?perL(last):0,sorted:sorted,perL:perL};
}
function costOf(p,avg){return (+p.resinMl||0)/1000*avg+(+p.hours||0)*(+SET.hourCost||0)+(+p.extra||0)+(p.finish==='painted'?(+p.paintCost||0):0)}
function periodStart(){

}

/* ---------- charts ---------- */
function barChart(){
  var now=new Date(),keys=[];
  for(var i=5;i>=0;i--){var d=new Date(now.getFullYear(),now.getMonth()-i,1);keys.push(d.getFullYear()+'-'+pad(d.getMonth()+1))}
  var vals=keys.map(function(k){return totalsBy(function(d){return String(d).slice(0,7)===k}).profit});
  var lo=Math.min.apply(null,vals.concat(0)),hi=Math.max.apply(null,vals.concat(0));
  if(hi===lo)hi=lo+1;
  var top=30,bot=150,h=bot-top;
  function y(v){return top+(hi-v)/(hi-lo)*h}
  var z=y(0),out='<svg class="chart" viewBox="0 0 600 190" role="img" aria-label="Profit per month, last six months">';
  out+='<line x1="10" x2="590" y1="'+z+'" y2="'+z+'" style="stroke:var(--line);stroke-width:1"/>';
  vals.forEach(function(v,i){
    var cx=50+i*100,yy=y(v),bh=Math.max(Math.abs(yy-z),v===0?0:2),ty=v>=0?yy:z;
    var fill=v<0?'var(--bad)':(i===5?'var(--accent)':'var(--bar-past)');
    out+='<rect x="'+(cx-24)+'" y="'+ty+'" width="48" height="'+bh+'" rx="3" style="fill:'+fill+'"/>';
    var ly=v>=0?ty-7:ty+bh+15;
    out+='<text x="'+cx+'" y="'+ly+'" text-anchor="middle" style="fill:var(--muted);font:500 12px var(--font-mono)">'+esc(EUR0.format(v))+'</text>';
    out+='<text x="'+cx+'" y="180" text-anchor="middle" style="fill:var(--muted);font:500 12px var(--font-mono)">'+MON[+keys[i].slice(5)-1]+'</text>';
  });
  return out+'</svg>';
}
function spark(vals,avg){
  if(vals.length<2)return '';
  var W=300,H=70,p=8,lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),span=hi-lo||1;
  var pts=vals.map(function(v,i){return [p+i*(W-2*p)/(vals.length-1),p+(hi-v)/span*(H-2*p)]});
  var d=pts.map(function(q){return q[0].toFixed(1)+','+q[1].toFixed(1)}).join(' ');
  var ya=p+(hi-avg)/span*(H-2*p),e=pts[pts.length-1];
  return '<svg class="spark" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Resin price per litre over time">'+
    '<line x1="'+p+'" x2="'+(W-p)+'" y1="'+ya+'" y2="'+ya+'" style="stroke:var(--line);stroke-dasharray:3 4"/>'+
    '<polyline points="'+d+'" style="fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round"/>'+
    '<circle cx="'+e[0]+'" cy="'+e[1]+'" r="4" style="fill:var(--accent)"/></svg>';
}

/* ---------- sheet ---------- */
function openSheet(cfg){
  sheetCfg=cfg;
  var f=cfg.fields.map(function(fl){
    var v=cfg.values[fl.key]==null?'':cfg.values[fl.key],id='f-'+fl.key,inp;
    if(fl.type==='select')inp='<select id="'+id+'">'+fl.options.map(function(o){return '<option value="'+esc(o.value)+'"'+(o.value===v?' selected':'')+'>'+esc(o.label)+'</option>'}).join('')+'</select>';
    else if(fl.type==='file')inp=(fl.current?'<img class="preview" alt="" data-img="'+esc(fl.current)+'">':'')+'<input id="'+id+'" type="file" accept="image/*">';
    else if(fl.type==='datetime')inp='<input id="'+id+'" type="datetime-local" value="'+esc(v)+'">';
    else if(fl.type==='area')inp='<textarea id="'+id+'" rows="3" maxlength="900">'+esc(v)+'</textarea>';
    else if(fl.type==='swatch')inp='<div class="swatches" role="group" aria-label="Color">'+fl.colors.map(function(c){return '<button type="button" class="sw" data-swatch="'+c.hex+'" data-name="'+esc(c.name)+'" title="'+esc(c.name)+'" aria-label="'+esc(c.name)+'" aria-pressed="'+(c.hex===v)+'" style="--c:'+c.hex+'"></button>'}).join('')+'</div><span class="swname">'+esc((fl.colors.find(function(c){return c.hex===v})||{}).name||'')+'</span><input id="'+id+'" type="hidden" value="'+esc(v)+'">';
    else if(fl.type==='check')inp='<input id="'+id+'" type="checkbox"'+(v===true?' checked':'')+'>';
    else if(fl.type==='password')inp='<input id="'+id+'" type="password" value="" autocomplete="new-password">';
    else if(fl.type==='date')inp='<input id="'+id+'" type="date" value="'+esc(v)+'">';
    else if(fl.type==='text')inp='<input id="'+id+'" type="text" value="'+esc(v)+'" autocomplete="off"'+(fl.ph?' placeholder="'+esc(fl.ph)+'"':'')+'>';
    else inp='<input id="'+id+'" type="text" inputmode="decimal" value="'+esc(fin(v))+'" autocomplete="off">';
    return '<div class="field'+(fl.wide?' wide':'')+(fl.type==='check'?' check':'')+'"><label for="'+id+'">'+esc(fl.label)+(fl.unit?' <span class="unit">'+esc(fl.unit)+'</span>':'')+'</label>'+inp+'</div>';
  }).join('');
  var root=$('#sheet');
  root.innerHTML='<form class="sheet-body" id="sheet-form" novalidate><h3>'+esc(cfg.title)+'</h3>'+(cfg.before||'')+'<div class="fields">'+f+'</div><p class="live" id="sheet-live"></p><p class="err" id="sheet-err" role="alert"></p>'+
    '<div class="sheet-acts"><div class="grp">'+(cfg.onDelete?'<button type="button" class="btn danger" id="sheet-del">Delete</button>':'')+(cfg.extra||[]).map(function(x,i){return '<button type="button" class="btn" id="sheet-x'+i+'">'+esc(x.label)+'</button>'}).join('')+'</div><div class="grp"><button type="button" class="btn" data-act="close">Cancel</button><button type="submit" class="btn primary">'+esc(cfg.cta||'Save')+'</button></div></div></form>';
  root.hidden=false;hydrate();
  var form=$('#sheet-form');
  function vals(){var o={};cfg.fields.forEach(function(fl){var el=$('#f-'+fl.key);o[fl.key]=fl.type==='file'?(el.files&&el.files[0]):fl.type==='check'?el.checked:el.value});return o}
  var api={set:function(k,v){$('#f-'+k).value=v},note:function(t){$('#sheet-live').textContent=t}};
  function live(){if(cfg.live)cfg.live(vals(),api)}
  form.addEventListener('input',live);form.addEventListener('change',live);live();
  form.addEventListener('click',function(e){
    var sw=e.target.closest&&e.target.closest('[data-swatch]');if(!sw)return;
    var fld=sw.closest('.field'),hid=fld.querySelector('input[type=hidden]');
    hid.value=sw.getAttribute('data-swatch');
    fld.querySelectorAll('[data-swatch]').forEach(function(b){b.setAttribute('aria-pressed',b===sw?'true':'false')});
    var nm=fld.querySelector('.swname');if(nm)nm.textContent=sw.getAttribute('data-name')||'';
    live();
  });
  (cfg.extra||[]).forEach(function(x,i){var b=$('#sheet-x'+i);if(b)b.addEventListener('click',function(){x.run(vals())})});
  form.addEventListener('submit',async function(e){
    e.preventDefault();var err=$('#sheet-err');err.textContent='';
    try{var r=await cfg.onSave(vals());if(typeof r==='string'){err.textContent=r;return}closeSheet()}
    catch(x){err.textContent='Could not save ('+((x&&x.code)||'error')+'). Try again.'}
  });
  var d=$('#sheet-del');
  if(d)d.addEventListener('click',async function(){
    if(!d.dataset.armed){d.dataset.armed='1';d.textContent='Tap again to delete';return}
    try{await cfg.onDelete();closeSheet()}catch(x){$('#sheet-err').textContent='Could not delete ('+((x&&x.code)||'error')+').'}
  });
  var first=form.querySelector('input,select');if(first)first.focus();
}
function closeSheet(){$('#sheet').hidden=true;$('#sheet').innerHTML='';sheetCfg=null;if(TC.dirty||SYNC.pendingRender){TC.dirty=false;SYNC.pendingRender=false;render()}}

function productSheet(p){
  var isNew=!p;p=p||{name:'',finish:'unpainted',paintCost:'',qty:0,minStock:2,resinMl:'',extra:0,price:''};
  openSheet({title:isNew?'Add figure':'Edit figure',cta:isNew?'Add figure':'Save',values:p,
    fields:[{key:'name',label:'Name',type:'text',wide:true,ph:'Chibi figure, 8 cm'},
      {key:'finish',label:'Finish',type:'select',options:[{value:'unpainted',label:'Unpainted'},{value:'painted',label:'Painted'}]},
      {key:'paintCost',label:'Paint cost per piece',unit:'€ if painted'},
      {key:'qty',label:'In stock',unit:'pieces'},{key:'minStock',label:'Low stock alert',unit:'pieces'},
      {key:'resinMl',label:'Resin per piece',unit:'ml'},{key:'extra',label:'Other cost per piece',unit:'€'},
      {key:'hours',label:'Print time per piece',unit:'hours',wide:true},
      {key:'price',label:'Selling price',unit:'€',wide:true}].concat(imageFields(p)),
    live:function(v,api){var R=resin(),ml=n0(v.resinMl),ex=n0(v.extra),pr=n0(v.price);
      if([ml,ex,pr].some(isNaN))return api.note('');
      var c=costOf({resinMl:ml,extra:ex,hours:n0(v.hours)||0,finish:v.finish,paintCost:n0(v.paintCost)},R.avg);api.note('Cost per piece '+money(c)+(pr>0?' · profit '+money(pr-c)+' ('+pct((pr-c)/pr)+')':'')+(c>0?' · for a 50% / 60% / 70% margin charge '+money(c/.5)+' / '+money(c/.4)+' / '+money(c/.3):''))},
    onSave:async function(v){
      var name=v.name.trim();if(!name)return 'Give the figure a name.';
      var q=n0(v.qty),m=n0(v.minStock),ml=n0(v.resinMl),ex=n0(v.extra),pr=n0(v.price),pc=n0(v.paintCost),hr=n0(v.hours);
      if([q,m,ml,ex,pr,pc,hr].some(function(x){return isNaN(x)||x<0}))return 'Use numbers of zero or more.';
      if(!(pr>0))return 'Enter a selling price above zero.';
      var o={id:isNew?uid():p.id,name:name,finish:v.finish==='painted'?'painted':'unpainted',paintCost:pc,qty:Math.round(q),minStock:Math.round(m),resinMl:ml,extra:ex,price:pr,hours:hr};
      if(p.example)o.example=true;
      var old=p.imageId||'',imageId=old;
      if(v.removeImage)imageId='';
      if(v.image){try{imageId=await uploadImage(v.image,900,'image/jpeg')}catch(x){return 'Could not upload the photo ('+((x&&x.code)||'error')+').'}}
      if(imageId)o.imageId=imageId;
      if(p.gallery&&p.gallery.length)o.gallery=p.gallery;
      await put('products',o);
      if(old&&old!==imageId)await dropAsset(old);
    },
    onDelete:isNew?null:async function(){await del('products',p.id);await dropAsset(p.imageId);var gl=p.gallery||[];for(var gi=0;gi<gl.length;gi++)await dropAsset(gl[gi])}});
}
function purchaseSheet(p){
  var isNew=!p;p=p||{date:today(),name:'',liters:1,price:'',supplier:''};

function saleSheet(preId){
  if(!S.products.length){toast('Add a figure on the Stock tab first.');return}
  var R=resin(),first=S.products.find(function(x){return x.id===preId})||S.products[0],last=first.id;
  openSheet({title:'Record sale',cta:'Record sale',values:{date:today(),product:first.id,qty:1,price:first.price},
    fields:[{key:'date',label:'Date',type:'date'},
      {key:'product',label:'Figure',type:'select',options:S.products.map(function(x){return {value:x.id,label:x.name+(x.finish==='painted'?' (painted)':'')}})},
      {key:'qty',label:'Quantity',unit:'pieces'},{key:'price',label:'Price each',unit:'€'}],
    live:function(v,api){
      var p=S.products.find(function(x){return x.id===v.product});if(!p)return;
      if(v.product!==last){last=v.product;api.set('price',fin(p.price));v.price=String(p.price)}
      var q=n0(v.qty),pr=n0(v.price);if(isNaN(q)||isNaN(pr))return api.note('');
      var c=costOf(p,R.avg);api.note('Cost each '+money(c)+' · profit '+money(q*(pr-c))+' · '+Math.max(0,(+p.qty||0)-q)+' left in stock')},
    onSave:async function(v){
      var p=S.products.find(function(x){return x.id===v.product});if(!p)return 'Pick a figure.';
      var q=n0(v.qty),pr=n0(v.price);
      if(!v.date)return 'Pick the sale date.';
      if(isNaN(q)||q<1||q!==Math.round(q))return 'Quantity must be a whole number, at least 1.';
      if(isNaN(pr)||pr<0)return 'Enter the price each.';
      await recordSale(p,v.date,q,pr);
    }});
}
async function recordSale(p,date,q,price){
  var sale={id:uid(),date:date,productId:p.id,name:p.name,qty:q,unitPrice:price,unitCost:costOf(p,resin().avg),ml:+p.resinMl||0,hrs:+p.hours||0};
  await put('sales',sale);
  await put('products',Object.assign({},p,{qty:Math.max(0,(+p.qty||0)-q)}));
  var so=adjustDrop(p.id,q);
  if(so)setTimeout(function(){toast('Drop "'+so.name+'" is sold out. Post it on the Discord tab.')},1200);
  return sale.id;
}
async function removeSale(id){
  var s=S.sales.find(function(x){return x.id===id});if(!s)return;
  await del('sales',id);
  var p=S.products.find(function(x){return x.id===s.productId});
  if(p)await put('products',Object.assign({},p,{qty:(+p.qty||0)+s.qty}));
  adjustDrop(s.productId,-s.qty);
}
function stepQty(id,delta){
  var p=S.products.find(function(x){return x.id===id});if(!p)return;
  var q=Math.max(0,(+p.qty||0)+delta);p.qty=q;pendingQty.set(id,q);render();
  clearTimeout(timers.get(id));
  timers.set(id,setTimeout(async function(){
    var cur=S.products.find(function(x){return x.id===id});
    if(!cur){pendingQty.delete(id);return}
    var want=pendingQty.get(id);
    try{await put('products',Object.assign({},cur,{qty:want}))}catch(e){toast('Could not save the stock change.')}
    if(pendingQty.get(id)===want)pendingQty.delete(id);
  },600));
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');if(!el)return;
  var act=el.getAttribute('data-act'),id=el.getAttribute('data-id'),v=el.getAttribute('data-v');
  if(act==='tab'){ui.tab=v;ui.gallery=null;try{localStorage.setItem('rl-tab',v)}catch(x){}render();window.scrollTo(0,0)}
  else if(act==='period'){ui.period=v;render()}
  else if(act==='finish'){ui.finish=v;render()}
  else if(act==='brand')brandSheet();
  else if(act==='inc')stepQty(id,1);
  else if(act==='dec')stepQty(id,-1);
  else if(act==='sell'){var p=S.products.find(function(x){return x.id===id});if(p&&(+p.qty||0)>=1)recordSale(p,today(),1,+p.price||0).then(function(){toast('Recorded 1 × '+p.name)},function(){toast('Could not record the sale.')})}
  else if(act==='add-product')productSheet();
  else if(act==='edit-product')productSheet(S.products.find(function(x){return x.id===id}));
  else if(act==='add-purchase')purchaseSheet();
  else if(act==='edit-purchase')purchaseSheet(S.purchases.find(function(x){return x.id===id}));
  else if(act==='add-sale')saleSheet();
  else if(act==='del-sale'){
    if(ui.confirm!==id){ui.confirm=id;render();setTimeout(function(){if(ui.confirm===id){ui.confirm=null;render()}},3500)}
    else{ui.confirm=null;var s=S.sales.find(function(x){return x.id===id});
      removeSale(id).then(function(){toast('Sale deleted and stock restored.')},function(){toast('Could not delete the sale.')})}
  }
  else if(act==='seed')seed();
  else if(act==='export')exportData();
  else if(act==='discord-summary')postCosmic(summaryPayload());
  else if(act==='discord-stock')postCosmic(stockPayload());
  else if(act==='hook-test')postCosmic({label:'CONNECTED',embed:{author:{name:'📡 SIGNAL CHECK'},title:'✦ Resinaprint is connected ✦',description:'Test transmission from your app.'}});
  else if(act==='dtab'){ui.dtab=v;render()}
  else if(act==='resinview'){ui.resinView=v;render()}
  else if(act==='release-new')releaseSheet();
  else if(act==='stock-back')backInStockSheet();
  else if(act==='stock-low'){var lp=lowStockPayload();if(!lp)toast('Nothing is low right now.');else postCosmic(lp)}
  else if(act==='banner-toggle'){try{localStorage.setItem('rl-banner',el.checked?'1':'0')}catch(x){}toast(el.checked?'Cosmic banner on.':'Cosmic banner off.')}
  else if(act==='hook-remove'){setHook('');render();toast('Webhook removed.')}
  else if(act==='discord-compose'){var ta=$('#msg'),t=ta?ta.value.trim():'';if(!t){toast('Write a message first.');return}postCosmic({label:'MESSAGE',embed:{author:{name:'💫 TRANSMISSION'},description:t.slice(0,4000)}}).then(function(ok){if(ok&&$('#msg'))$('#msg').value=''})}
  else if(act==='drop-new')dropSheet();
  else if(act==='drop')dropSheet(id);
  else if(act==='import')$('#import-file').click();
  else if(act==='import-apply')applyImport();
  else if(act==='import-cancel'){pendingImport=null;render()}
  else if(act==='clear-examples')clearExamples();
  else if(act==='close')closeSheet();
  else if(act==='theme')applyTheme(nextTheme(),true);
  else if(act==='costview'){ui.costView=v;render()}
  else if(act==='fail-new')failSheet();
  else if(act==='edit-fail')failSheet(S.fails.find(function(x){return x.id===id}));
  else if(act==='cost-new')costSheet();
  else if(act==='edit-cost')costSheet(S.costs.find(function(x){return x.id===id}));
  else if(act==='order-new')orderSheet();
  else if(act==='edit-order')orderSheet(S.orders.find(function(x){return x.id===id}));
  else if(act==='ordfilter'){ui.ordFilter=v;render()}
  else if(act==='ord-ship'||act==='ord-deliver'){var oo=S.orders.find(function(x){return x.id===id});if(oo)put('orders',Object.assign({},oo,{status:act==='ord-ship'?'shipped':'delivered'})).then(function(){toast(act==='ord-ship'?'Marked as shipped.':'Marked as delivered.')})}
  else if(act==='ord-post'){var op=S.orders.find(function(x){return x.id===id});if(op)postOrderShipped(op)}
  else if(act==='drop-sold'){var ds=(SET.drops||[]).find(function(x){return x.id===id});if(ds){var ed0=+ds.edition||0,w0=+ds.sold||0;ds.sold=Math.min(ed0,w0+1);lsSave();render();if(ds.sold>=ed0&&w0<ed0)toast('Sold out. You can post it to Discord now.')}}
  else if(act==='drop-update'){var du=(SET.drops||[]).find(function(x){return x.id===id});if(du)postDropUpdate(du)}
  else if(act==='drop-soldout'){var dso=(SET.drops||[]).find(function(x){return x.id===id});if(dso)postSoldOut(dso)}
  else if(act==='drop-del'){
    if(ui.confirm!==id){ui.confirm=id;render();setTimeout(function(){if(ui.confirm===id){ui.confirm=null;render()}},3500)}
    else{ui.confirm=null;SET.drops=(SET.drops||[]).filter(function(x){return x.id!==id});lsSave();render()}
  }
  else if(act==='csv')csvDownload(v);
  else if(act==='goal')goalSheet();
  else if(act==='pcmode'){pcSave();SET.calc=Object.assign({},SET.calc,{mode:v});lsSave();render()}
  else if(act==='pc-apply'){var pc=S.products.find(function(x){return x.id===(SET.calc||{}).product});if(pc){var np=Math.round(parseFloat(v)*100)/100;put('products',Object.assign({},pc,{price:np})).then(function(){toast('Price set to '+money(np)+'.')})}}
  else if(act==='queue-new')queueSheet();
  else if(act==='queue-low')queueLow();
  else if(act==='edit-queue')queueSheet(S.queue.find(function(x){return x.id===id}));
  else if(act==='q-start'||act==='q-back')queueSetStatus(id,act==='q-start'?'printing':'todo');
  else if(act==='q-done')queueSetStatus(id,'done');
  else if(act==='q-undo')queueSetStatus(id,'todo');
  else if(act==='sup-new')supSheet();
  else if(act==='edit-sup')supSheet(S.supplies.find(function(x){return x.id===id}));
  else if(act==='sup-inc'||act==='sup-dec'){var sx=S.supplies.find(function(x){return x.id===id});if(sx)put('supplies',Object.assign({},sx,{qty:Math.max(0,(+sx.qty||0)+(act==='sup-inc'?1:-1))}))}
  else if(act==='resin-count')resinCountSheet();
  else if(act==='slot-take'){var sd=(SET.releases||[]).find(function(x){return x.id===id});if(sd){var n1=+sd.slots||0,w1=+sd.taken||0;sd.taken=Math.min(n1,w1+1);lsSave();render();if(sd.taken>=n1&&w1<n1)toast('All slots taken. You can post it as closed.')}}
  else if(act==='slot-update'){var su=(SET.releases||[]).find(function(x){return x.id===id});if(su)postSlots(su,false)}
  else if(act==='slot-closed'){var sc=(SET.releases||[]).find(function(x){return x.id===id});if(sc)postSlots(sc,true)}
  else if(act==='biz')bizSheet();
  else if(act==='ord-inv'){var oi=S.orders.find(function(x){return x.id===id});if(oi)makeDoc(oi,'invoice')}
  else if(act==='ordview'){ui.ordView=v;if(v==='orders')ui.ordCust='';render()}
  else if(act==='cust-open'){ui.ordCust=v;ui.ordView='orders';ui.ordFilter='all';render()}
  else if(act==='cust-clear'){ui.ordCust='';render()}
  else if(act==='taxy'){ui.taxY=Math.min(0,(+ui.taxY||0)+parseInt(v,10));render()}
  else if(act==='yr-csv')yearCsv();
  else if(act==='yr-pdf')yearPdf();
  else if(act==='minmargin')minMarginSheet();
  else if(act==='shop-copy'){copyText('Shopping list – '+((SET.biz&&SET.biz.name)||'Resinaprint')+'\n'+shopItems().map(function(t){return '- '+t}).join('\n'),'Shopping list copied.')}
  else if(act==='ord-msg'){var om=S.orders.find(function(q){return q.id===id});if(om)msgSheet(om)}
  else if(act==='shop-import')pickShopifyCsv();
  else if(act==='pc-fig'){SET.calc=Object.assign({},calcState(),{product:id});lsSave();ui.tab='pricing';render()}
  else if(act==='taxq'){ui.taxQ=Math.min(0,(+ui.taxQ||0)+parseInt(v,10));render()}
  else if(act==='tax-set')taxSheet();
  else if(act==='go-supplies'){ui.resinView='supplies';ui.tab='resin';render();window.scrollTo(0,0)}
  else if(act==='rem-new')remSheet();
  else if(act==='rem-edit')remSheet(S.reminders.find(function(x){return x.id===id}));
  else if(act==='rem-done'){var rd=S.reminders.find(function(x){return x.id===id});if(rd)put('reminders',Object.assign({},rd,{done:true}))}
  else if(act==='report')reportSheet(v);
  else if(act==='gallery'){ui.gallery=id;render();window.scrollTo(0,0)}
  else if(act==='gal-back'){ui.gallery=null;render()}
  else if(act==='gal-add'){var gf=$('#gal-file');if(gf)gf.click()}
  else if(act==='gal-cover'){var gp=S.products.find(function(x){return x.id===ui.gallery});if(gp){var gg=(gp.gallery||[]).filter(function(x){return x!==id});if(gp.imageId)gg.push(gp.imageId);put('products',Object.assign({},gp,{imageId:id,gallery:gg}))}}
  else if(act==='gal-del'){
    if(ui.confirm!==id){ui.confirm=id;render();setTimeout(function(){if(ui.confirm===id){ui.confirm=null;render()}},3500)}
    else{ui.confirm=null;var dp=S.products.find(function(x){return x.id===ui.gallery});
      if(dp){var dg=(dp.gallery||[]).filter(function(x){return x!==id}),dc=dp.imageId;if(dc===id){dc=dg.shift()||''}
        var no=Object.assign({},dp,{gallery:dg});if(dc)no.imageId=dc;else delete no.imageId;put('products',no).then(function(){return dropAsset(id)})}}
  }
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t||(t.id!=='q-stock'&&t.id!=='q-sales'))return;
  var pos=t.selectionStart;if(t.id==='q-stock')ui.qs=t.value;else ui.qa=t.value;
  render();var n=$('#'+t.id);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(x){}}
});
document.addEventListener('change',async function(e){
  var t=e.target;if(!t||!t.id)return;
  if(t.id==='sort-stock'){ui.sortS=t.value;render();return}
  if(t.id==='sort-sales'){ui.sortA=t.value;render();return}
  if(t.id!=='gal-file')return;
  var p=S.products.find(function(x){return x.id===ui.gallery}),files=Array.prototype.slice.call(t.files||[]);
  if(!p||!files.length)return;
  toast('Adding photos…');
  var o=Object.assign({},p,{gallery:(p.gallery||[]).slice()}),room=12-(o.gallery.length+(o.imageId?1:0)),bad=0;
  for(var i=0;i<files.length&&room>0;i++){try{var id=await uploadImage(files[i],900,'image/jpeg');if(!o.imageId)o.imageId=id;else o.gallery.push(id);room--}catch(x){bad++}}
  await put('products',o);t.value='';
  toast(bad?'Some photos could not be read.':'Photos added.');
});
document.addEventListener('input',function(e){
  var t=e.target;if(!t||!t.id||t.id.indexOf('pc-')!==0||t.id==='pc-product')return;
  var c=pcSave(),o=$('#pc-out');if(o)o.innerHTML=pcOut(c);
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t||t.id!=='pc-product')return;
  pcSave();
  var p=S.products.find(function(x){return x.id===t.value});
  var c=Object.assign({},SET.calc,{product:t.value});
  if(p){c.ml=String(+p.resinMl||'');c.hours=+p.hours?String(p.hours):'';c.extras=+p.extra?String(p.extra):'';c.paint=p.finish==='painted'&&+p.paintCost?String(p.paintCost):'';c.test=''}
  Object.keys(c).forEach(function(k){if(typeof c[k]==='string')c[k]=c[k].replace('.',',')});
  SET.calc=c;lsSave();render();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetCfg)closeSheet()});
document.addEventListener('submit',function(e){
  if(!e.target||e.target.id!=='hook-form')return;
  e.preventDefault();
  var v=($('#hook-url').value||'').trim(),err=$('#hook-err');
  if(!HOOK_RE.test(v)){err.textContent='That is not a Discord webhook link. It starts with https://discord.com/api/webhooks/';return}
  if(!setHook(v)){err.textContent='Could not save it on this device.';return}
  render();toast('Webhook saved. Tap Send test message to try it.');
});
document.addEventListener('change',function(e){
  var inp=e.target;if(!inp||inp.id!=='import-file')return;
  var f=inp.files&&inp.files[0];if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{var d=JSON.parse(r.result);if(!d||d.app!=='resinaprint')throw new Error('x');pendingImport=d;render()}
    catch(x){toast('That file is not a Resinaprint backup.')}
    inp.value='';
  };
  r.readAsText(f);
});

var savedTheme='cosmic';try{savedTheme=localStorage.getItem('rl-theme')||'cosmic'}catch(e){}
applyTheme(savedTheme,false);
initSky();gateBoot();
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
})();
</script>
