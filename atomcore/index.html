<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Rift Shop</title>
<meta http-equiv="refresh" content="0; url=../riftshop/">
<style>body{background:#0d0a16;color:#ece8f6;font:16px system-ui;display:grid;place-items:center;height:100vh;margin:0}</style>
</head>
<body>
<p>Moved to <a href="../riftshop/" style="color:#9a76ff">Rift Shop</a>…</p>
<script>
// ATOMCORE was replaced by Rift Shop. Remove its offline cache, then go to the new game.
if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope.indexOf('/atomcore/') >= 0) r.unregister(); }); });
location.replace('../riftshop/');
</script>
</body>
</html>
